  .work-card:hover .card-img-wrap img,.gallery-card:hover .project-frame img,.cylinder-frame:hover .cylinder-img,.partner-card:hover .partner-logo-img,.badge-frame:hover .badge-img,.canvas-card:hover .canvas-card-img{transform:none!important}
  .canvas-card:hover .canvas-card-img{opacity:.8!important}
  .vision-aperture:hover .vision-aperture-img{transform:none!important;filter:grayscale(100%) contrast(1.15)!important}
  .cert-card:hover .cert-frame,.badge-frame:hover{transform:none!important}
  .partner-card:hover .partner-vertical-text{transform:rotate(180deg)!important}
  .project-overlay,.artistry-overlay{opacity:1!important}
  .project-info{transform:none!important;opacity:1!important}
  .badge-issuer-pill{opacity:1;transform:translate(-50%,0)}
}

/* Reduced Motion Override */
@media (prefers-reduced-motion: reduce){
  *,::after,::before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  #transition-curtain{display:none}
  .horizontal-track{transform:none!important}
  .card-inner{transform:none!important}
  .card-reflection{display:none!important}
  .project-frame img{transform:none!important}
  .clip-reveal{clip-path:none!important}
  .word{transform:none!important;opacity:1!important}
  .magnetic-btn,.magnetic-text{transform:none!important}
  .timeline-item{transform:none!important;opacity:1!important}
  .timeline-node{transform:scale(1)!important}
  .skills-grid{transform:none!important}
  .work-cta-link{transform:none!important}
  .impact-hairline{transform:none!important}
  .cert-card,.cert-frame{opacity:1!important;transform:none!important;transition:none!important}
  .badges-grid-container{transform:none!important}
  #event-wall{height:auto;padding:8vh 4vw}
  .cylinder-stage{position:relative;height:auto;width:100%;perspective:none;padding:0;gap:24px}

let renderer = null, scene = null, camera = null, canvas = null;

function initThree() {

function buildPath() {
  const pts = [];

const op = new Vector3(), ot = new Vector3(), up = new Vector3(), Y = new Vector3(0, 1, 0), vp = new Vector3();

function poseRibbon(c, head) {
  const pos = c.geo.attributes.position, centre = head - c.i * STEP;

function renderHero() {

  l2.style.transform = `translate3d(${-run}vw,${rise * 34}vh,0)`;

    cap.style.transform = `translate(-50%,calc(-50% + ${rise * 34}vh))`;

/* ---------- LENIS SMOOTH SCROLL & DYNAMIC HEADER ---------- */
let lenis = null;
let lastScroll = 0;
let scrollVelocity = 0;
const topHeader = document.querySelector('.top');

function initLenis() {
  if (prefersReducedMotion) return; // Fall back to native scrolling for users with motion sensitivity

  if (typeof window.Lenis !== 'undefined') {
    lenis = new window.Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    });
    window.lenis = lenis;

    lenis.on('scroll', (e) => {
      const currentScroll = e.scroll;
      scrollVelocity = e.velocity || 0;
      const trackEl = $('track');
      if (trackEl && currentPath === '/') {
        target = clamp(currentScroll / (trackEl.offsetHeight - innerHeight));
      }

      // Dynamic header state past 100vh
      if (currentScroll > innerHeight) {
        topHeader.classList.add('is-fixed');
        if (currentScroll > lastScroll && currentScroll - lastScroll > 4) {
          topHeader.classList.add('nav-hidden');
        } else if (currentScroll < lastScroll && lastScroll - currentScroll > 4) {
          topHeader.classList.remove('nav-hidden');
        }
      } else {
        topHeader.classList.remove('is-fixed', 'nav-hidden');
      }
      document.body.classList.toggle('fixed-nav-visible', topHeader.classList.contains('is-fixed') && !topHeader.classList.contains('nav-hidden'));
      lastScroll = currentScroll;
      updateHorizontalSection();
      updateParallaxImages();
      updateHomeExtensions();
      updateAboutExtensions();
    });
  } else {
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      const trackEl = $('track');
      if (trackEl && currentPath === '/') {
        target = clamp(currentScroll / (trackEl.offsetHeight - innerHeight));
      }
      if (currentScroll > innerHeight) {
        topHeader.classList.add('is-fixed');
        if (currentScroll > lastScroll) topHeader.classList.add('nav-hidden');
        else topHeader.classList.remove('nav-hidden');
      } else {
        topHeader.classList.remove('is-fixed', 'nav-hidden');
      }
      document.body.classList.toggle('fixed-nav-visible', topHeader.classList.contains('is-fixed') && !topHeader.classList.contains('nav-hidden'));
      lastScroll = currentScroll;
      updateHorizontalSection();
      updateParallaxImages();
      updateHomeExtensions();
      updateAboutExtensions();
    }, {passive:true});
  }
}

function renderErrorFallback(error, attemptedPath = '/', isNotFound = false) {
  try {
    stopWebGLLoop();
    disposeThree();
    cleanupRouteEffects();
  } catch (_) {}

  isTransitioning = false;
  document.body.dataset.transitioning = 'false';
  document.body.dataset.route = isNotFound ? '404' : 'error';

  if (curtain) {
    curtain.style.transformOrigin = 'top';
    curtain.style.transform = 'scaleY(0)';
  }

  const heading = isNotFound ? 'ROUTE NOT FOUND' : 'RENDER INTERRUPTED';
  const code = isNotFound ? '[ 404 / UNKNOWN ROUTE ]' : '[ 500 / RECOVERY FALLBACK ]';
  const detail = isNotFound
    ? `The requested path "${attemptedPath}" does not exist in this portfolio.`
    : 'An unexpected runtime exception occurred while mounting this view. State locks and WebGL contexts have been safely reset.';

  if (error) {
    console.error('[SPA Router Recovery]', error);
  }

  appContainer.innerHTML = `
    <main class="route-error-page" role="alert" aria-live="assertive">
      <div class="route-error-code">${code}</div>
      <h1 class="route-error-title" tabindex="-1">${heading}</h1>
      <p class="route-error-msg">${detail}</p>
      <button type="button" class="route-error-btn" id="error-return-home">Return Home →</button>
    </main>
  `;

  const returnBtn = $('error-return-home');
  if (returnBtn) {
    returnBtn.addEventListener('click', () => {
      navigate('/', true);
    });
  }
  const h1 = appContainer.querySelector('.route-error-title');
  if (h1) h1.focus();
}

function navigate(url, push = true) {
  // Lock state: prevent spam clicks or concurrent animations
  if (!canTransition(isTransitioning)) return;

  try {
    const cleanPath = resolveRouteKey(url, Object.keys(routes));
    const displayPath = (url.split('?')[0].split('#')[0] || '/').replace(/\/+$/, '') || '/';

    isTransitioning = true;
    document.body.dataset.transitioning = 'true';
    closeMobileMenu();
    closeContactDrawer();

    // Pause WebGL RAF loop & hide canvas immediately when leaving home
    if (cleanPath !== '/') {
      stopWebGLLoop();
      const glCanvas = $('gl');
      if (glCanvas) {
        glCanvas.style.opacity = '0';
        glCanvas.style.pointerEvents = 'none';
      }
    }

    // Step 1: Animate curtain scaleY to 1 with transform-origin: bottom
    curtain.style.transformOrigin = 'bottom';
    curtain.style.transition = prefersReducedMotion ? 'none' : 'transform 0.6s cubic-bezier(0.7, 0, 0.3, 1)';
    curtain.style.transform = 'scaleY(1)';

    setTimeout(() => {
      try {
        // Blackout phase: tear down old route listeners, observers, timers, and WebGL resources
        cleanupRouteEffects();
        if (cleanPath !== '/') {
          disposeThree();
        }

        const targetUrlPath = cleanPath || displayPath;
        if (push && window.location.pathname !== targetUrlPath) {
          history.pushState(null, '', targetUrlPath);
        }

        if (lenis) lenis.scrollTo(0, { immediate: true });
        window.scrollTo(0, 0);
        lastScroll = 0;
        topHeader.classList.remove('is-fixed', 'nav-hidden');
        document.body.classList.remove('fixed-nav-visible');

        if (!cleanPath) {
          currentPath = displayPath;
          updateActiveNav('');
          renderErrorFallback(null, displayPath, true);
          return;
        }

        currentPath = cleanPath;
        document.body.dataset.route = cleanPath;
        updateActiveNav(cleanPath);
        updateSEO(cleanPath);
        analytics.onRouteChange(cleanPath);

        // Execute route render function
        const renderFn = routes[cleanPath];
        renderFn();

        // Fade canvas back in if returning to home
        if (cleanPath === '/') {
          const glCanvas = $('gl');
          if (glCanvas) {
            glCanvas.style.opacity = '1';
            glCanvas.style.pointerEvents = 'auto';
          }
        }

        // Step 2: Animate curtain scaleY to 0 with transform-origin: top
        curtain.style.transformOrigin = 'top';
        curtain.style.transform = 'scaleY(0)';
        if (cleanPath === '/contact') {
          requestAnimationFrame(() => {
            const contactRoot = $('contact-page-root');
            if (contactRoot) contactRoot.classList.add('is-entered');
          });
        }

        setTimeout(() => {
          try {
            isTransitioning = false;
            document.body.dataset.transitioning = 'false';
            curtain.style.transformOrigin = 'bottom';

            // Accessibility: programmatically shift focus to main h1 or first actionable element
            const mainH1 = document.querySelector('main h1, .work-hero-title, .contact-display-title, .work-header h1, .credentials-hero-title, .founder-headline');
            if (mainH1) {
              mainH1.setAttribute('tabindex', '-1');
              mainH1.focus({ preventScroll: true });
            }

            initRouteEffects(cleanPath);
          } catch (effectErr) {
            renderErrorFallback(effectErr, cleanPath, false);
          }
        }, prefersReducedMotion ? 10 : 600);
      } catch (renderErr) {
        renderErrorFallback(renderErr, displayPath, false);
      }
    }, prefersReducedMotion ? 10 : 600);
  } catch (outerErr) {
    renderErrorFallback(outerErr, url, false);
  }
}

/* ---------- WEBSITE-WIDE IMAGE INTERACTION PROTECTION ---------- */
let imageProtectionAbortController = null;
let imageProtectionObserver = null;

function applyImageProtection(root = document) {
  if (!root) return;
  if (root instanceof HTMLImageElement) {
    root.setAttribute('draggable', 'false');
    root.setAttribute('data-protected', 'true');
  } else if (typeof root.querySelectorAll === 'function') {
    root.querySelectorAll('img').forEach((img) => {
      img.setAttribute('draggable', 'false');
      img.setAttribute('data-protected', 'true');
    });
    if (root instanceof Element && root.matches(PROTECTED_IMAGE_CONTAINER_SELECTOR)) {
      root.setAttribute('data-image-protection', 'true');
    }
    root.querySelectorAll(PROTECTED_IMAGE_CONTAINER_SELECTOR).forEach((el) => {
      el.setAttribute('data-image-protection', 'true');
    });
  }
}

function isProtectedImageTarget(eventTarget) {
  const el =
    eventTarget instanceof Element
      ? eventTarget
      : eventTarget && eventTarget.parentElement
        ? eventTarget.parentElement
        : null;
  if (!el) return false;
  const isExemptInteractiveControl = Boolean(
    el.closest('input, textarea, select, [contenteditable="true"]')
  );
  return shouldProtectImageInteraction({
    tagName: el.tagName,
    hasClosestImg: Boolean(el.closest('img')),
    hasDataImageProtection: Boolean(el.closest('[data-image-protection]')),
    hasProtectedContainerAncestor: Boolean(el.closest(PROTECTED_IMAGE_CONTAINER_SELECTOR)),
    isExemptInteractiveControl,
  });
}

function cleanupImageProtection() {
  if (imageProtectionAbortController) {
    imageProtectionAbortController.abort();
    imageProtectionAbortController = null;
  }
  if (imageProtectionObserver) {
    imageProtectionObserver.disconnect();
    imageProtectionObserver = null;
  }
}

function initImageProtection() {
  if (imageProtectionAbortController) return;
  imageProtectionAbortController = new AbortController();
  const { signal } = imageProtectionAbortController;

  document.addEventListener(
    'contextmenu',
    (e) => {
      if (isProtectedImageTarget(e.target)) {
        e.preventDefault();
        e.stopPropagation();
      }
    },
    { capture: true, signal }
  );

  document.addEventListener(
    'dragstart',
    (e) => {
      if (isProtectedImageTarget(e.target)) {
        e.preventDefault();
        e.stopPropagation();
      }
    },
    { capture: true, signal }
  );

  document.addEventListener(
    'selectstart',
    (e) => {
      if (isProtectedImageTarget(e.target)) {
        e.preventDefault();
      }
    },
    { capture: true, signal }
  );

  applyImageProtection(document);

  const observeTarget = appContainer || document.body;
  if (observeTarget && typeof MutationObserver !== 'undefined') {
    imageProtectionObserver = new MutationObserver((mutations) => {
      for (const m of mutations) {
        if (m.type === 'childList') {
          m.addedNodes.forEach((node) => {
            if (node instanceof Element) {
              applyImageProtection(node);
            }
          });
        } else if (m.type === 'attributes' && m.target instanceof Element) {
          applyImageProtection(m.target);
        }
      }
    });
    imageProtectionObserver.observe(observeTarget, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['src'],
    });
  }
}

  return CYLINDER_FRAMES.map((item, idx) => {

    return `
    <article
      class="cylinder-frame"
      data-index="${idx}"
      style="transform: rotateY(${idx * 36}deg) translateZ(${initRadius}px);"
      tabindex="0"
      role="group"
      aria-label="Community &amp; Hackathon Archive ${num}"
    >
      <span class="cylinder-index">${num}</span>
      <img
        src="${item.image}"
        alt="Community &amp; Hackathon Archive ${num}"
        class="cylinder-img"
        loading="eager"
        decoding="sync"
        onerror="this.onerror=null;this.src='${item.fallbackImage}';"
      />
    </article>

}

function renderWorkEditorial() {
  const decksHtml = EDITORIAL_DECKS.map(
    (deck) => `
      <article class="editorial-deck-card">
        <div class="editorial-deck-media">
          <span class="editorial-slide-badge">${deck.slides}</span>
          <img
            src="${deck.image}"
            alt="${deck.title}"
            loading="lazy"
            decoding="async"
            onerror="this.onerror=null;this.src='${deck.fallback}';"
          />
        </div>
        <div class="editorial-deck-meta">
          <h3 class="editorial-deck-title">${deck.title}</h3>
          <p class="editorial-deck-desc">${deck.desc}</p>
        </div>
      </article>
    `
  ).join('');

  const blogsHtml = EDITORIAL_BLOGS.map(
    (blog, idx) => `
      <article class="editorial-blog-item" data-index="${idx}">
        <button
          type="button"
          class="editorial-blog-trigger"
          tabindex="0"
          aria-expanded="false"
          aria-controls="editorial-drawer-${idx}"
        >
          <div class="editorial-blog-meta">
            <div>${blog.index}</div>
            <div>${blog.date} · ${blog.readTime}</div>
          </div>
          <div class="editorial-blog-headline">${blog.headline}</div>
          <span class="editorial-blog-toggle">READ ARTICLE +</span>
        </button>
        <div class="editorial-blog-drawer" id="editorial-drawer-${idx}" role="region" aria-label="${blog.headline}">
          <div class="editorial-article-body">
            ${blog.paragraphs.map((p) => `<p>${p}</p>`).join('')}
            <div class="editorial-article-callout">${blog.callout}</div>
          </div>
        </div>
      </article>
    `
  ).join('');

  appContainer.innerHTML = `
    <main class="subpage-root" id="work-editorial-page">
      ${getSubpageTopbarHtml('[ SUB-PAGE 03 / 03 — EDITORIAL ]')}
      <section class="subpage-hero">
        <div class="subpage-kicker">[ 03 / EDITORIAL — TECH PRESENTATIONS &amp; BLOG WRITING ]</div>
        <h1 class="subpage-hero-title">TECHNICAL DECKS &amp; ENGINEERING ESSAYS.</h1>
        <p class="subpage-hero-sub">Structured architectural slide decks and long-form technical articles rendered directly inline.</p>
      </section>
      ${renderMarqueeStripHtml(EDITORIAL_MARQUEE_ITEMS)}
      <section class="editorial-decks-section" aria-label="Technical Presentation Decks">
        <div class="editorial-sec-label">[ PART A / TECH PRESENTATION ARCHITECTURES — 05 DECKS ]</div>
        <div class="editorial-decks-grid">
          ${decksHtml}
        </div>
      </section>
      <section class="editorial-blogs-section" aria-label="Interactive Tech Blog Articles">
        <div class="editorial-sec-label">[ PART B / ENGINEERING DISPATCHES — 03 ARTICLES ]</div>
        <div class="editorial-blog-list" id="editorial-blog-list">
          ${blogsHtml}
        </div>
      </section>
      ${getFooterMarkup()}
    </main>
  `;
}

  switch (category) {
    case 'GOOGLE':
      return `<svg viewBox="0 0 24 24"><path d="M12.24 10.285V13.8h6.887C18.2 16.5 15.64 18.5 12.24 18.5c-3.7 0-6.72-3.02-6.72-6.72s3.02-6.72 6.72-6.72c1.7 0 3.24.64 4.44 1.7l2.64-2.64C17.64 2.5 15.08 1.5 12.24 1.5 6.44 1.5 1.76 6.18 1.76 12s4.68 10.5 10.48 10.5c5.8 0 10.08-4.08 10.08-10.26 0-.7-.08-1.3-.2-1.955H12.24z"/></svg>`;
    case 'MICROSOFT':
      return `<svg viewBox="0 0 24 24"><path d="M2 2h9v9H2zm11 0h9v9h-9zM2 13h9v9H2zm11 0h9v9h-9z"/></svg>`;
    case 'POSTMAN':
      return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

function renderCertificateCardsHtml(items, isPortrait = false) {
  return items.map((cert) => `
    <article class="cert-card" tabindex="0" role="region" aria-label="${cert.name}"${cert.verifyUrl ? ` data-verify-url="${cert.verifyUrl}"` : ''}>
      <div class="cert-frame${isPortrait ? ' is-portrait' : ''}">
        <span class="cert-plus-mark" aria-hidden="true">+</span>
        <img
          ${hasValidCertImageSrc(cert.img) ? `src="${cert.img}"` : ''}
          data-cert-slot="true"
          alt="${hasValidCertImageSrc(cert.img) ? cert.name : ''}"
          loading="eager"
          decoding="sync"
          referrerpolicy="no-referrer"
          style="
            width: 100%;
            height: 100%;
            object-fit: ${isPortrait ? 'contain' : 'cover'};
            display: none;
          "
        />
        <div class="cert-spotlight" aria-hidden="true"></div>
      </div>
      <div class="cert-caption">
        <div class="cert-name">${cert.name}</div>
        <div class="cert-id">${formatCertificateId(cert.id)}</div>
      </div>
    </article>
  `).join('');
}

function renderCredentials() {
  const academicCardsHtml =
    renderCertificateCardsHtml(academicCertificates) +
    renderCertificateCardsHtml(additionalAcademicCertificates, true);
  const instituteCardsHtml = renderCertificateCardsHtml(instituteCertificates);
  const hackathonCardsHtml = renderCertificateCardsHtml(hackathonCertificates);

  const badgeCounts = computeBadgeCategoryCounts(DEV_BADGES);
  const filterBarHtml = BADGE_FILTER_CATEGORIES.map((cat) => `
    <button
      type="button"
      class="badge-filter-btn${cat === 'ALL' ? ' is-active' : ''}"
      data-filter="${cat}"
      aria-pressed="${cat === 'ALL' ? 'true' : 'false'}"
    >${cat} [${badgeCounts[cat]}]</button>
  `).join('');

  const badgesHtml = DEV_BADGES.map((b) => `
    <div class="badge-frame${b.url ? '' : ' is-fallback'}" tabindex="0" role="region" data-category="${b.category}" aria-label="${b.title} by ${b.issuerLabel}">
      ${b.url ? `<img
        src="${b.url}"
        alt="${b.title} — ${b.issuerLabel}"
        class="badge-img"
        loading="eager"
        decoding="sync"
        referrerpolicy="no-referrer"
      />` : ''}
      <div class="badge-fallback" aria-hidden="true">

        <span>${b.issuerLabel}</span>
      </div>
      <span class="badge-issuer-pill" aria-hidden="true">${b.issuerLabel}</span>

/* ---------- ROUTE SPECIFIC EFFECTS, CLEANUP & ACCESSIBILITY ---------- */
let manifestoObserver = null;
let portraitObserver = null;
let timelineObserver = null;
let impactObserver = null;
let partnersObserver = null;
let certObserver = null;
let systemsObserver = null;
let principlesObserver = null;
let capBladeObserver = null;
let routeAbortController = null;
let routeTimers = [];
let routeCleanupFns = [];
let impactCounterRafId = null;

function cleanupRouteEffects() {
  if (routeAbortController) {
    routeAbortController.abort();
    routeAbortController = null;
  }
  routeCleanupFns.forEach((fn) => {
    try {
      if (typeof fn === 'function') fn();
    } catch (_) {}
  });
  routeCleanupFns = [];
  [manifestoObserver, portraitObserver, timelineObserver, impactObserver, partnersObserver, certObserver, systemsObserver, principlesObserver, capBladeObserver].forEach((obs) => {
    if (obs) obs.disconnect();
  });
  manifestoObserver = null;
  portraitObserver = null;
  timelineObserver = null;
  impactObserver = null;
  partnersObserver = null;
  certObserver = null;
  systemsObserver = null;
  principlesObserver = null;
  capBladeObserver = null;
  manifestoVisible = false;

  if (impactCounterRafId !== null) {
    cancelAnimationFrame(impactCounterRafId);
    impactCounterRafId = null;
  }
  routeTimers.forEach((id) => clearTimeout(id));
  routeTimers = [];

  isKeyboardFocused = false;
}

function getDocTop(el) {
  const scrollTop = lenis ? lenis.scroll : window.scrollY;
  return el.getBoundingClientRect().top + scrollTop;
}

function scrollLenisTo(targetY) {
  if (lenis && !prefersReducedMotion) {
    lenis.scrollTo(targetY, { duration: 0.7 });
  } else {
    window.scrollTo({ top: targetY, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
  }
}

function bindTrackKeyboardCentering(signal) {
  document.addEventListener(
    'focusin',
    (e) => {
      const workCard = e.target.closest('.work-card');
      if (workCard) {
        const section = workCard.closest('#index, #work-track');
        if (section && window.innerWidth > 768) {
          const cardsInTrack = Array.from(section.querySelectorAll('.work-card'));
          const idx = cardsInTrack.indexOf(workCard);
          if (idx >= 0) {
            const targetY = calcHorizontalFocusScrollTarget(
              getDocTop(section),
              section.offsetHeight,
              window.innerHeight,
              idx,
              cardsInTrack.length
            );
            scrollLenisTo(targetY);
          }
        }
        return;
      }

      const artistryFrame = e.target.closest('.artistry-frame');
      if (artistryFrame) {
        const section = $('about-artistry');
        if (section && window.innerWidth > 768) {
          const frames = Array.from(section.querySelectorAll('.artistry-frame'));
          const idx = frames.indexOf(artistryFrame);
          if (idx >= 0) {
            const targetY = calcHorizontalFocusScrollTarget(
              getDocTop(section),
              section.offsetHeight,
              window.innerHeight,
              idx,
              frames.length
            );
            scrollLenisTo(targetY);
          }
        }
        return;
      }

      const canvasCard = e.target.closest('.canvas-card');
      if (canvasCard) {
        const section = $('about-process');
        if (section && !prefersReducedMotion) {
          const cardsInDeck = Array.from(section.querySelectorAll('.canvas-card'));
          const idx = cardsInDeck.indexOf(canvasCard);
          if (idx >= 0) {
            const targetY = calcHorizontalFocusScrollTarget(
              getDocTop(section),
              section.offsetHeight,
              window.innerHeight,
              idx,
              cardsInDeck.length
            );
            scrollLenisTo(targetY);
          }
        }
        return;
      }

      const cylinderFrame = e.target.closest('.cylinder-frame');
      if (cylinderFrame) {
        const section = $('event-wall');
        if (section && !prefersReducedMotion) {
          const idx = parseInt(cylinderFrame.dataset.index || '0', 10);
          const targetY = calcCylinderFocusScrollTarget(
            getDocTop(section),
            section.offsetHeight,
            window.innerHeight,
            idx,
            CYLINDER_FRAMES.length
          );
          scrollLenisTo(targetY);
        }
      }
    },
    { signal }
  );
}

function initRouteEffects(path) {
  cleanupRouteEffects();
  routeAbortController = new AbortController();
  const { signal } = routeAbortController;

  applyImageProtection(appContainer || document);
  bindTrackKeyboardCentering(signal);

  if (path === '/') {
    bindHomeEvents(signal);
    bindCardTiltEvents(signal);
    analytics.bindWorkCardTracking(document, signal);
  } else if (path === '/work') {
    bindCardTiltEvents(signal);
    updateHorizontalSection();
    analytics.bindWorkCardTracking(document, signal);
    archiveCtaX = 0;
    archiveCtaY = 0;
    targetArchiveCtaX = 0;
    targetArchiveCtaY = 0;
    initWorkRouteEffects(signal);
  } else if (path === '/work/systems') {
    initWorkSystemsEffects();
  } else if (path === '/work/studio') {
    initWorkStudioEffects(signal);
  } else if (path === '/work/editorial') {
    initWorkEditorialEffects(signal);
  } else if (path === '/credentials') {
    initCredentialsRouteEffects(signal);
  } else if (path === '/about') {
    const portrait = $('portrait-frame');
    if (portrait) {
      portraitObserver = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            portrait.classList.add('is-revealed');
          }
        });
      }, { threshold: 0.1 });
      portraitObserver.observe(portrait);

      const rect = portrait.getBoundingClientRect();
      if (rect.top < window.innerHeight && rect.bottom > 0) {
        routeTimers.push(setTimeout(() => portrait.classList.add('is-revealed'), 100));
      }
    }

    const timelineItems = document.querySelectorAll('.timeline-item');
    if (timelineItems.length) {
      timelineObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      timelineItems.forEach(item => {
        timelineObserver.observe(item);
        const rect = item.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.85) {
          item.classList.add('in-view');
        }
      });
    }

    const principleCards = document.querySelectorAll('#what-we-stand-for .principle-card');
    if (principleCards.length) {
      if (prefersReducedMotion) {
        principleCards.forEach((card) => card.classList.add('is-revealed'));
      } else {
        principlesObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-revealed');
              principlesObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px -10px 0px' });
        principleCards.forEach((card, idx) => {
          card.style.transitionDelay = `${idx * 70}ms`;
          principlesObserver.observe(card);
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight * 0.92) {
            card.classList.add('is-revealed');
          }
        });
      }
    }
  } else if (path === '/contact') {
    btnX = 0; btnY = 0; targetBtnX = 0; targetBtnY = 0;
    textX = 0; textY = 0; targetTextX = 0; targetTextY = 0;
    initContactRouteEffects(signal);
  }
}

function initWorkSystemsEffects() {
  const cards = document.querySelectorAll('.systems-card');
  if (!cards.length) return;
  if (prefersReducedMotion) {
    cards.forEach((c) => c.classList.add('is-revealed'));
    return;
  }
  systemsObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-revealed');
          if (systemsObserver) systemsObserver.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.08, rootMargin: '0px 0px -30px 0px' }
  );
  cards.forEach((card, idx) => {
    card.style.transitionDelay = `${(idx % 3) * 70}ms`;
    systemsObserver.observe(card);
    const rect = card.getBoundingClientRect();
    if (rect.top < window.innerHeight * 0.95 && rect.bottom > 0) {
      card.classList.add('is-revealed');
    }
  });
}

function initWorkStudioEffects(signal) {

      frames.forEach((frame) => {

              });
            });
          }
        } else {

function initContactRouteEffects(signal) {
  const root = $('contact-page-root');
  if (root && !root.classList.contains('is-entered')) {
    requestAnimationFrame(() => {
      root.classList.add('is-entered');
    });
  }

  // 1. Live IST Clock (cleared cleanly on route exit)
  const clockEl = $('contact-ist-clock');
  if (clockEl) {
    clockEl.textContent = formatISTClock();
    const clockIntervalId = setInterval(() => {
      clockEl.textContent = formatISTClock();
    }, 1000);
    routeCleanupFns.push(() => clearInterval(clockIntervalId));
  }

  // 2. Scope Pill Toggle State
  let selectedScopes = [];
  const pillsWrap = $('contact-scope-pills');
  if (pillsWrap) {
    pillsWrap.addEventListener(
      'click',
      (e) => {
        const pill = e.target.closest('.contact-scope-pill');
        if (!pill) return;
        const scope = pill.getAttribute('data-scope') || '';
        selectedScopes = toggleContactScope(selectedScopes, scope);
        const isActive = selectedScopes.includes(scope);
        pill.classList.toggle('active', isActive);
        pill.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      },
      { signal }
    );
  }

  // 3. Magnetic Submit Button (disabled on touch screens & reduced-motion)
  const submitBtn = $('contact-submit-btn');
  if (submitBtn) {
    const canMagnetize = () => !isTouchDevice() && !prefersReducedMotion && window.innerWidth >= 768;
    submitBtn.addEventListener(
      'mousemove',
      (e) => {
        if (!canMagnetize()) {
          submitBtn.style.transform = 'none';
          return;
        }
        const rect = submitBtn.getBoundingClientRect();
        const { x, y } = calcContactMagneticOffset(
          e.clientX,
          e.clientY,
          rect.left + rect.width / 2,
          rect.top + rect.height / 2,
          12,
          Math.max(rect.width * 0.65, 220)
        );
        submitBtn.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      },
      { signal, passive: true }
    );
    submitBtn.addEventListener(
      'mouseleave',
      () => {
        submitBtn.style.transform = 'translate3d(0px, 0px, 0)';
      },
      { signal }
    );
  }

  // 4. Form Validation & Live Transmission Receipt
  const formEl = $('contact-brief-form');
  const receiptEl = $('contact-receipt');
  const errorEl = $('contact-form-error');
  const nameInput = $('contact-name');
  const emailInput = $('contact-email');
  const timelineInput = $('contact-timeline');
  const messageInput = $('contact-message');

  function escapeContactHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  if (formEl && receiptEl) {
    formEl.addEventListener(
      'submit',
      (e) => {
        e.preventDefault();
        const payload = {
          name: nameInput ? nameInput.value : '',
          email: emailInput ? emailInput.value : '',
          timeline: timelineInput ? timelineInput.value : '',
          message: messageInput ? messageInput.value : ''
        };
        const validation = validateContactBrief(payload);
        if (!validation.valid) {
          if (errorEl) errorEl.textContent = validation.errors[0];
          if (!payload.name.trim() && nameInput) nameInput.focus();
          else if ((!payload.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email.trim())) && emailInput) emailInput.focus();
          else if (messageInput) messageInput.focus();
          return;
        }
        if (errorEl) errorEl.textContent = '';

        const refCode = generateContactRefCode();
        const scopesToRender = selectedScopes.length > 0 ? selectedScopes : ['GENERAL INQUIRY'];
        const scopeTagsHtml = scopesToRender
          .map((s) => `<span class="contact-receipt-scope-tag">${escapeContactHtml(s)}</span>`)
          .join('');
        const timelineRow = payload.timeline.trim()
          ? `<div class="contact-receipt-row"><span class="contact-receipt-key">TIMELINE / TYPE</span><span class="contact-receipt-val">${escapeContactHtml(payload.timeline.trim())}</span></div>`
          : '';

        receiptEl.innerHTML = `
          <div class="contact-receipt-kicker">TRANSMISSION LOGGED // BRIEF RECEIVED</div>
          <div class="contact-receipt-ref">${refCode}</div>
          <div class="contact-receipt-grid">
            <div class="contact-receipt-row">
              <span class="contact-receipt-key">SENDER</span>
              <span class="contact-receipt-val">${escapeContactHtml(payload.name.trim())}</span>
            </div>
            <div class="contact-receipt-row">
              <span class="contact-receipt-key">RETURN CHANNEL</span>
              <span class="contact-receipt-val">${escapeContactHtml(payload.email.trim())}</span>
            </div>
            ${timelineRow}
            <div>
              <div class="contact-receipt-key" style="font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;margin-bottom:8px;">SELECTED SCOPE</div>
              <div class="contact-receipt-scopes">${scopeTagsHtml}</div>
            </div>
          </div>
          <button type="button" class="contact-reset-btn" id="contact-reset-btn">COMPOSE ANOTHER MESSAGE</button>
        `;

        const showReceipt = () => {
          formEl.classList.add('is-hidden');
          formEl.classList.remove('is-leaving');
          receiptEl.classList.add('is-visible');
          requestAnimationFrame(() => {
            receiptEl.classList.add('is-entered');
          });
          const resetBtn = $('contact-reset-btn');
          if (resetBtn) {
            resetBtn.addEventListener(
              'click',
              () => {
                receiptEl.classList.remove('is-entered', 'is-visible');
                receiptEl.innerHTML = '';
                formEl.reset();
                selectedScopes = [];
                document.querySelectorAll('.contact-scope-pill').forEach((p) => {
                  p.classList.remove('active');
                  p.setAttribute('aria-pressed', 'false');
                });
                formEl.classList.remove('is-hidden', 'is-leaving');
                if (nameInput) nameInput.focus();
              },
              { once: true, signal }
            );
            resetBtn.focus();
          }
        };

        if (prefersReducedMotion) {
          showReceipt();
        } else {
          formEl.classList.add('is-leaving');
          routeTimers.push(setTimeout(showReceipt, 280));
        }
      },
      { signal }
    );
  }

  // 5. Copy Portfolio Link to Clipboard
  const copyBtn = $('copy-portfolio-btn');
  if (copyBtn) {
    let copyResetTimer = null;
    copyBtn.addEventListener(
      'click',
      async () => {
        const originUrl = window.location.origin || window.location.href;
        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            await navigator.clipboard.writeText(originUrl);
          } else {
            const ta = document.createElement('textarea');
            ta.value = originUrl;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
          }
        } catch (_) {
          // Graceful fallback if clipboard permission is blocked in sandboxed preview
        }
        copyBtn.textContent = 'COPIED TO CLIPBOARD ✓';
        copyBtn.classList.add('is-copied');
        if (copyResetTimer) clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          copyBtn.textContent = 'COPY PORTFOLIO LINK';
          copyBtn.classList.remove('is-copied');
        }, 2000);
        routeTimers.push(copyResetTimer);
      },
      { signal }
    );
  }
}

function updateParallaxImages() {

    const center = rect.top + rect.height / 2;
    const progress = clamp(1 - center / vh);

/* ---------- INFINITE MARQUEE WITH SCROLL ACCELERATION ---------- */
let marqueePos = 0;
function updateMarquee() {
  const track = $('marquee-track');
  if (!track) return;
  if (prefersReducedMotion) return;
  const baseSpeed = 1.0;
  const boost = Math.min(Math.abs(scrollVelocity) * 0.08, 8.0);
  marqueePos -= (baseSpeed + boost);
  const halfWidth = track.scrollWidth / 2;
  if (Math.abs(marqueePos) >= halfWidth) {
    marqueePos = 0;
  }
  track.style.transform = `translate3d(${marqueePos.toFixed(1)}px, 0, 0)`;
}

/* ---------- MANIFESTO WORDS ANIMATION ---------- */
let manifestoVisible = false;
function updateManifestoWords() {
  const manifestoEl = $('manifesto');
  if (!manifestoVisible || !manifestoEl) return;
  const words = manifestoEl.querySelectorAll('.word');
  if (!words.length) return;

  if (prefersReducedMotion) {
    words.forEach(w => {
      w.style.transform = 'translateY(0)';
      w.style.opacity = '1';
    });
    return;
  }

  const rect = manifestoEl.getBoundingClientRect();
  const vh = innerHeight;
  const totalTravel = vh + rect.height;
  const currentPos = vh - rect.top;
  const rawProgress = clamp(currentPos / totalTravel);

  const total = words.length;
  words.forEach((word, i) => {
    const start = 0.22 + (i / total) * 0.45;
    const end = start + 0.14;
    const wordProgress = clamp((rawProgress - start) / (end - start));
    const ty = (1 - wordProgress) * 110;
    word.style.transform = `translateY(${ty.toFixed(1)}%)`;
    word.style.opacity = wordProgress.toFixed(2);
  });
}

/* ---------- KINETIC HORIZONTAL SCROLL & 3D TILT ---------- */
function bindCardTiltEvents(signal) {
  const workCards = document.querySelectorAll('.work-card');
  workCards.forEach(card => {
    card.addEventListener(
      'pointermove',
      (e) => {
        if (prefersReducedMotion || isTouchDevice() || e.pointerType === 'touch') return;
        card.classList.remove('is-resetting');
        const rect = card.getBoundingClientRect();
        const normX = clamp(((e.clientX - rect.left) / rect.width - 0.5) * 2, -1, 1);
        const normY = clamp(((e.clientY - rect.top) / rect.height - 0.5) * 2, -1, 1);
        card.style.setProperty('--mouse-x', normX.toFixed(3));
        card.style.setProperty('--mouse-y', (-normY).toFixed(3));
      },
      { signal }
    );

    card.addEventListener(
      'pointerleave',
      () => {
        card.classList.add('is-resetting');
        card.style.setProperty('--mouse-x', '0');
        card.style.setProperty('--mouse-y', '0');
      },
      { signal }
    );

    card.addEventListener(
      'click',

        if (currentPath !== '/work') {
          navigate('/work');

}

function updateHorizontalSection() {
  if (currentPath !== '/' && currentPath !== '/work') return;
  const section = $('work-track') || $('index');
  const track = $('horizontal-track');
  const fill = $('horizontal-progress-fill');
  const counter = $('horizontal-counter');
  if (!section || !track) return;

  if (prefersReducedMotion) {
    track.style.transform = 'none';
    return;
  }

  const rect = section.getBoundingClientRect();
  const vh = innerHeight;
  const scrollableDistance = rect.height - vh;
  if (scrollableDistance <= 0) return;

  const progress = clamp(-rect.top / scrollableDistance, 0, 1);
  const maxShift = track.scrollWidth - window.innerWidth + (window.innerWidth * 0.1);
  const translateX = -progress * Math.max(0, maxShift);

  track.style.transform = `translate3d(${translateX.toFixed(2)}px, 0, 0)`;

  if (fill) {
    fill.style.transform = `scaleX(${progress.toFixed(3)})`;
  }
  if (counter) {
    const totalCards = track.querySelectorAll('.work-card').length || 4;
    const counterState = calcHorizontalCounterState(progress, totalCards);
    counter.textContent = counterState.label;
  }
}

/* ---------- WEBGL LIQUID REFLECTIONS DISPLACEMENT SHADER ---------- */
let lastLiquidTime = 0;
function updateLiquidReflections(time) {
  if (prefersReducedMotion || (currentPath !== '/' && currentPath !== '/work')) return;
  const section = $('work-track') || $('index');
  if (!section) return;
  const rect = section.getBoundingClientRect();
  if (rect.bottom < -50 || rect.top > window.innerHeight + 50) return;

  if (time - lastLiquidTime < 32) return;
  lastLiquidTime = time;

  const turb = $('liquid-turb');
  const disp = $('liquid-disp');
  if (!turb || !disp) return;

  const timeSec = time * 0.001;
  const calmSine = Math.sin(timeSec * 2.2);
  const calmCos = Math.cos(timeSec * 1.7);
  const baseScale = 6 + calmSine * 2.5;
  const vel = Math.abs(scrollVelocity);
  const velBoost = Math.min(vel * 1.6, 40);
  const totalScale = baseScale + velBoost;

  const baseFreqX = 0.012 + calmSine * 0.003;
  const baseFreqY = 0.035 + calmCos * 0.006;
  const velFreqBoost = Math.min(vel * 0.0015, 0.035);

  turb.setAttribute('baseFrequency', `${(baseFreqX + velFreqBoost * 0.4).toFixed(4)} ${(baseFreqY + velFreqBoost).toFixed(4)}`);
  disp.setAttribute('scale', totalScale.toFixed(2));
}

window.addEventListener('pointermove', (e) => {

    return;
  }
  mouseX = e.clientX;

}, { passive: true });


/* ---------- MAGNETIC BUTTON WITH KEYBOARD & MOBILE OVERRIDES ---------- */
let btnX = 0, btnY = 0, targetBtnX = 0, targetBtnY = 0;
let textX = 0, textY = 0, targetTextX = 0, targetTextY = 0;
let isKeyboardFocused = false;

function updateMagnetic() {
  const magBtn = document.querySelector('.magnetic-btn');
  const magText = document.querySelector('.magnetic-text');
  if (!magBtn || !magText) return;

  // Disable physics on touch/mobile screens or if triggered via keyboard focus
  if (window.innerWidth < 768 || isTouchDevice() || isKeyboardFocused || prefersReducedMotion) {
    magBtn.style.transform = 'none';
    magText.style.transform = 'none';
    return;
  }

  const rect = magBtn.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const dist = Math.hypot(mouseX - centerX, mouseY - centerY);
  const triggerRadius = (rect.width / 2) + 100;

  if (dist < triggerRadius && mouseX > 0 && mouseY > 0) {
    const dx = mouseX - centerX;
    const dy = mouseY - centerY;
    let rawX = dx * 0.3;
    let rawY = dy * 0.3;
    const rawLen = Math.hypot(rawX, rawY);
    if (rawLen > 40 && rawLen > 0) {
      targetBtnX = (rawX / rawLen) * 40;
      targetBtnY = (rawY / rawLen) * 40;
    } else {
      targetBtnX = rawX;
      targetBtnY = rawY;
    }

    let rawTextX = dx * 0.5;
    let rawTextY = dy * 0.5;
    const rawTextLen = Math.hypot(rawTextX, rawTextY);
    if (rawTextLen > 60 && rawTextLen > 0) {
      targetTextX = (rawTextX / rawTextLen) * 60;
      targetTextY = (rawTextY / rawTextLen) * 60;
    } else {
      targetTextX = rawTextX;
      targetTextY = rawTextY;
    }
  } else {
    targetBtnX = 0;
    targetBtnY = 0;
    targetTextX = 0;
    targetTextY = 0;
  }

  btnX += (targetBtnX - btnX) * 0.1;
  btnY += (targetBtnY - btnY) * 0.1;
  textX += (targetTextX - textX) * 0.1;
  textY += (targetTextY - textY) * 0.1;

  magBtn.style.transform = `translate3d(${btnX.toFixed(2)}px, ${btnY.toFixed(2)}px, 0)`;
  magText.style.transform = `translate3d(${textX.toFixed(2)}px, ${textY.toFixed(2)}px, 0)`;
}

/* ---------- ARCHIVE CTA MAGNETIC PHYSICS (/work) ---------- */
let archiveCtaX = 0, archiveCtaY = 0;
let targetArchiveCtaX = 0, targetArchiveCtaY = 0;

function updateArchiveMagnetic() {
  const ctaLink = $('work-cta-link');
  if (!ctaLink) return;

  if (window.innerWidth < 768 || isTouchDevice() || prefersReducedMotion) {
    ctaLink.style.transform = 'none';
    return;
  }

  const rect = ctaLink.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const dist = Math.hypot(mouseX - centerX, mouseY - centerY);
  const triggerRadius = (rect.width / 2) + 120;

  if (dist < triggerRadius && mouseX > 0 && mouseY > 0) {
    const res = calcArchiveMagnetic(mouseX, mouseY, centerX, centerY, 0.15, 45);
    targetArchiveCtaX = res.x;
    targetArchiveCtaY = res.y;
  } else {
    targetArchiveCtaX = 0;
    targetArchiveCtaY = 0;
  }

  archiveCtaX += (targetArchiveCtaX - archiveCtaX) * 0.15;
  archiveCtaY += (targetArchiveCtaY - archiveCtaY) * 0.15;
  ctaLink.style.transform = `translate3d(${archiveCtaX.toFixed(2)}px, ${archiveCtaY.toFixed(2)}px, 0)`;
}

/* ---------- HACKATHON WALL & COMMUNITY IMPACT EFFECTS (/work) ---------- */
let impactCounted = false;

function triggerImpactCounter() {
  if (impactCounted) return;
  impactCounted = true;

  const num1 = $('impact-num-1');
  const num2 = $('impact-num-2');
  const num3 = $('impact-num-3');
  const num4 = $('impact-num-4');
  if (!num1 || !num2 || !num3 || !num4) return;

  if (prefersReducedMotion) {
    num1.textContent = '40+';
    num2.textContent = '1,200+';
    num3.textContent = '15+';
    num4.textContent = '08';
    return;
  }

  const duration = 1800;
  const startTime = performance.now();

  function step(now) {
    if (currentPath !== '/work') {
      impactCounterRafId = null;
      return;
    }
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);

    const val1 = calcCountUp(progress, 40, true);
    const val2 = calcCountUp(progress, 1200, true);
    const val3 = calcCountUp(progress, 15, true);
    const val4 = calcCountUp(progress, 8, true);

    num1.textContent = `${val1}+`;
    num2.textContent = `${val2.toLocaleString('en-US')}+`;
    num3.textContent = `${val3}+`;
    num4.textContent = String(val4).padStart(2, '0');

    if (progress < 1) {
      impactCounterRafId = requestAnimationFrame(step);
    } else {
      impactCounterRafId = null;
    }
  }

  impactCounterRafId = requestAnimationFrame(step);
}

let lastCylinderRadius = null;

function updateCylinderCarousel(forceLayout = false) {
  if (currentPath !== '/work') return;
  const eventWall = $('event-wall');
  const ring = $('cylinder-ring');
  const counter = $('cylinder-counter');
  const rail = $('cylinder-rail');
  if (!eventWall || !ring) return;

  const frames = ring.querySelectorAll('.cylinder-frame');
  if (!frames.length) return;

  if (prefersReducedMotion) {
    ring.style.transform = 'none';
    frames.forEach(frame => {
      frame.style.transform = 'none';
      frame.style.filter = 'none';
      frame.style.borderColor = 'var(--line)';
    });
    if (counter) counter.textContent = '[ 01 / 10 ]';
    return;
  }

  const isMobile = window.innerWidth < 768;
  const radius = calcCylinderRadius(window.innerWidth);
  const rect = eventWall.getBoundingClientRect();
  const vh = window.innerHeight;
  const p = calcTunnelProgress(rect.top, eventWall.offsetHeight, vh);
  const ringAngleDeg = calcCylinderRotationDeg(p, 36, frames.length);

  ring.style.transform = `translateZ(${(-radius * 0.35).toFixed(2)}px) rotateX(-4deg) rotateY(${ringAngleDeg.toFixed(3)}deg)`;

  frames.forEach((frame, idx) => {
    const { focus, grayscalePct, brightness, isFocused } = calcCylinderFrameFocus(idx, ringAngleDeg, 36);
    if (isMobile) {
      const mobileScale = 0.38 + 0.62 * Math.pow(focus, 2.2);
      frame.style.transform = `rotateY(${idx * 36}deg) translateZ(${radius}px) scale(${mobileScale.toFixed(3)})`;
    } else if (forceLayout || lastCylinderRadius !== radius) {
      frame.style.transform = `rotateY(${idx * 36}deg) translateZ(${radius}px)`;
    }
    frame.style.filter = `grayscale(${grayscalePct.toFixed(1)}%) brightness(${brightness.toFixed(3)})`;
    frame.style.borderColor = isFocused ? 'var(--ink)' : 'var(--line)';
  });
  lastCylinderRadius = radius;

  const activeIdx = calcCylinderActiveIndex(ringAngleDeg, frames.length, 36);
  if (counter) {
    counter.textContent = `[ ${String(activeIdx + 1).padStart(2, '0')} / ${String(frames.length).padStart(2, '0')} ]`;
  }
  if (rail) {
    const ticks = rail.querySelectorAll('.cylinder-tick');
    ticks.forEach((tick, idx) => {
      tick.classList.toggle('is-active', idx === activeIdx);
    });
  }
}

function initCylinderCarousel(signal) {
  lastCylinderRadius = null;
  updateCylinderCarousel(true);

  const onCylinderScroll = () => {
    updateCylinderCarousel(false);
  };
  const onCylinderResize = debounce(() => {
    updateCylinderCarousel(true);
  }, 120);

  if (lenis && !prefersReducedMotion) {
    const unsub = lenis.on('scroll', onCylinderScroll);
    if (typeof unsub === 'function') {
      routeCleanupFns.push(unsub);
    } else if (typeof lenis.off === 'function') {
      routeCleanupFns.push(() => lenis.off('scroll', onCylinderScroll));
    }
  } else {
    window.addEventListener('scroll', onCylinderScroll, { passive: true, signal });
  }
  window.addEventListener('resize', onCylinderResize, { signal });

  const rail = $('cylinder-rail');
  if (rail) {
    rail.addEventListener(
      'click',
      (e) => {
        const tick = e.target.closest('.cylinder-tick');
        if (!tick) return;
        const section = $('event-wall');
        if (!section) return;
        const idx = parseInt(tick.dataset.index || '0', 10);
        const targetY = calcCylinderFocusScrollTarget(
          getDocTop(section),
          section.offsetHeight,
          window.innerHeight,
          idx,
          CYLINDER_FRAMES.length
        );
        scrollLenisTo(targetY);
      },
      { signal }
    );
  }
}

function initPartnersDominoReveal() {
  const partnersSec = $('community-partners');
  const cards = document.querySelectorAll('.partner-card');
  if (!partnersSec || !cards.length) return;

  if (prefersReducedMotion) {
    cards.forEach(card => card.classList.add('is-revealed'));

  }

  cards.forEach((card, idx) => {
    const delay = calcPartnerStaggerDelay(idx, 0.05);
    card.style.transitionDelay = `${delay}s`;
  });

  partnersObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        cards.forEach(card => card.classList.add('is-revealed'));
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  partnersObserver.observe(partnersSec);

  const rect = partnersSec.getBoundingClientRect();
  if (rect.top < window.innerHeight * 0.9 && rect.bottom > 0) {
    cards.forEach(card => card.classList.add('is-revealed'));

function initCapabilityBlades(signal) {
  const capMap = $('capability-map');
  const statusEl = $('cap-gesture-status');
  if (!capMap) return;
  const blades = Array.from(capMap.querySelectorAll('.cap-blade'));
  if (!blades.length) return;

  const DEFAULT_STATUS = '[  CLICK TO EXPLORE ↗ ]';
  let hasEntered = false;
  let activeDrag = null;
  if (statusEl && window.innerWidth < 768) {
    statusEl.textContent = `[ SWIPE // 01 OF ${String(blades.length).padStart(2, '0')} ]`;
  }

  const updateMobileDeck = () => {
    if (window.innerWidth >= 768) return;
    const mapRect = capMap.getBoundingClientRect();
    const viewportCenterX = mapRect.left + mapRect.width / 2;
    const cardCenters = blades.map((b) => {
      const r = b.getBoundingClientRect();
      return r.left + r.width / 2;
    });
    const cardWidth = blades[0].getBoundingClientRect().width || mapRect.width * 0.8;
    const state = calcCapabilityMobileDeckState(viewportCenterX, cardCenters, cardWidth);
    if (!prefersReducedMotion) {
      blades.forEach((b, i) => {
        b.style.transition = 'transform 0.18s ease-out, opacity 0.18s ease-out';
        b.style.transform = `scale(${state.scales[i]})`;
        b.style.opacity = String(state.opacities[i]);
      });
    }
    if (statusEl && !activeDrag?.isDragging) {
      statusEl.textContent = state.statusText;
    }
  };

  const revealBlades = () => {
    if (hasEntered) return;
    hasEntered = true;
    if (prefersReducedMotion) {
      blades.forEach((b) => {
        b.classList.add('is-revealed', 'is-interactive');
      });
      if (window.innerWidth < 768) updateMobileDeck();
      return;
    }
    blades.forEach((blade, idx) => {
      const delayMs = idx * 60;
      blade.style.transitionDelay = `${delayMs}ms`;
      blade.classList.add('is-revealed');
      routeTimers.push(
        setTimeout(() => {
          blade.style.transitionDelay = '0ms';
          blade.classList.add('is-interactive');
          if (idx === blades.length - 1 && window.innerWidth < 768) {
            updateMobileDeck();
          }
        }, 850 + delayMs)
      );
    });
  };

  if (prefersReducedMotion) {
    revealBlades();
  } else {
    capBladeObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            revealBlades();
            if (capBladeObserver) capBladeObserver.disconnect();
          }
        });
      },
      { threshold: 0.08 }
    );
    capBladeObserver.observe(capMap);

    const mapRect = capMap.getBoundingClientRect();
    if (mapRect.top < window.innerHeight * 0.94 && mapRect.bottom > 0) {
      revealBlades();
    }
  }

  blades.forEach((blade) => {
    blade.addEventListener(
      'pointerdown',
      (e) => {
        if (prefersReducedMotion) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (window.innerWidth < 768 && e.pointerType === 'touch') return;
        blade.classList.add('is-interactive');
        blade.style.transitionDelay = '0ms';
        activeDrag = {
          blade,
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          isDragging: false
        };
      },
      { signal }
    );

    blade.addEventListener(
      'pointermove',
      (e) => {
        if (prefersReducedMotion || e.pointerType === 'touch' || window.innerWidth < 768) return;
        if (activeDrag && activeDrag.isDragging) return;
        blade.classList.add('is-interactive');
        blade.style.transitionDelay = '0ms';
        const r = blade.getBoundingClientRect();
        const tilt = calcCapabilityBladeTilt(e.clientX, e.clientY, r.left, r.top, r.width, r.height, 6);
        blade.style.setProperty('--mx', `${tilt.mxPct}%`);
        blade.style.setProperty('--my', `${tilt.myPct}%`);
        blade.style.transition = 'transform 0.12s ease-out';
        blade.style.transform = `perspective(1000px) rotateX(${tilt.rotateXdeg}deg) rotateY(${tilt.rotateYdeg}deg) translateZ(6px)`;
      },
      { signal }
    );

    blade.addEventListener(
      'pointerleave',
      () => {
        if (prefersReducedMotion || window.innerWidth < 768) return;
        if (activeDrag && activeDrag.blade === blade && activeDrag.isDragging) return;
        blade.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
        blade.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
      },
      { signal }
    );
  });

  window.addEventListener(
    'pointermove',
    (e) => {
      if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
      const dx = e.clientX - activeDrag.startX;
      const dy = e.clientY - activeDrag.startY;
      const phys = calcCapabilityDragPhysics(dx, dy, 8);
      if (phys.isDragging) {
        activeDrag.isDragging = true;
        activeDrag.blade.classList.add('is-dragging');
        activeDrag.blade.style.transition = 'none';
        activeDrag.blade.style.transform = `translate3d(${phys.translateXpx}px, ${phys.translateYpx}px, 0) skewX(${phys.skewXdeg}deg)`;
        if (statusEl) {
          statusEl.textContent = '[ GESTURE ACTIVE // RELEASE TO SNAP ]';
        }
      }
    },
    { signal }
  );

  const finishDrag = (e) => {
    if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
    const { blade, isDragging } = activeDrag;
    activeDrag = null;
    blade.classList.remove('is-dragging');
    if (isDragging) {
      blade.dataset.suppressClickUntil = String(performance.now() + 260);
      blade.style.transition = 'transform 0.65s cubic-bezier(0.22, 1.4, 0.36, 1)';
      blade.style.transform = 'translate3d(0, 0, 0) skewX(0deg)';
      if (window.innerWidth < 768) {
        updateMobileDeck();
      } else if (statusEl) {
        statusEl.textContent = DEFAULT_STATUS;
      }
    }
  };

  window.addEventListener('pointerup', finishDrag, { signal });
  window.addEventListener('pointercancel', finishDrag, { signal });

  capMap.addEventListener(
    'scroll',
    () => {
      updateMobileDeck();
    },
    { passive: true, signal }
  );

  window.addEventListener(
    'resize',
    debounce(() => {
      if (window.innerWidth < 768) {
        updateMobileDeck();
      } else {
        blades.forEach((b) => {
          b.style.opacity = '';
          b.style.transform = '';
          b.style.transition = '';
        });
        if (statusEl) statusEl.textContent = DEFAULT_STATUS;
      }
    }, 100),
    { signal }
  );

  capMap.addEventListener(
    'click',
    (e) => {
      const blade = e.target.closest('.cap-blade');
      if (!blade) return;
      const suppressUntil = parseFloat(blade.dataset.suppressClickUntil || '0');
      if (performance.now() < suppressUntil) {
        e.preventDefault();
        return;
      }
      const targetRoute = blade.dataset.route;
      if (!targetRoute) return;
      if (prefersReducedMotion) {
        navigate(targetRoute);
        return;
      }
      if (blade.dataset.launching === 'true') return;
      blade.dataset.launching = 'true';
      blade.classList.add('is-interactive');
      blade.style.transition = 'transform 0.12s cubic-bezier(0.16, 1, 0.3, 1)';
      blade.style.transform = 'scale(0.96)';
      routeTimers.push(
        setTimeout(() => {
          blade.dataset.launching = 'false';
          navigate(targetRoute);
        }, 120)
      );
    },
    { signal }
  );
}

/* ---------- CREDENTIALS ROUTE EFFECTS (/credentials) ---------- */
function initCredentialsRouteEffects(signal) {
  const certCards = document.querySelectorAll('.cert-card');
  if (certCards.length) {
    certObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-revealed');
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    certCards.forEach((card, idx) => {
      card.style.transitionDelay = `${(idx % 3) * 75}ms`;
      certObserver.observe(card);
      const rect = card.getBoundingClientRect();
      if (rect.top < window.innerHeight * 0.9 && rect.bottom > 0) {
        card.classList.add('is-revealed');
      }

      const frame = card.querySelector('.cert-frame');
      if (frame && !prefersReducedMotion && !isTouchDevice()) {
        card.addEventListener(
          'pointermove',
          (e) => {
            if (prefersReducedMotion || isTouchDevice() || e.pointerType === 'touch') return;
            const r = frame.getBoundingClientRect();
            const tilt = calcCapabilityBladeTilt(e.clientX, e.clientY, r.left, r.top, r.width, r.height, 6);
            frame.style.setProperty('--mx', `${tilt.mxPct}%`);
            frame.style.setProperty('--my', `${tilt.myPct}%`);
            frame.style.transition = 'transform 0.12s ease-out, border-color 0.4s ease, box-shadow 0.4s ease';
            frame.style.transform = `perspective(1000px) rotateX(${tilt.rotateXdeg}deg) rotateY(${tilt.rotateYdeg}deg)`;
          },
          { signal }
        );
        card.addEventListener(
          'pointerleave',
          () => {
            frame.style.transition = 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease';
            frame.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
          },
          { signal }
        );
      }
    });
  }

  // Dynamic image-slot visibility management (supports initial data + runtime src updates)
  const certSlots = document.querySelectorAll('img[data-cert-slot="true"]');
  if (certSlots.length) {
    const syncCertSlot = (img) => {
      const frame = img.closest('.cert-frame');
      const rawSrc = img.getAttribute('src');
      if (!hasValidCertImageSrc(rawSrc)) {
        img.style.display = 'none';
        if (frame) frame.classList.remove('has-image');
        return;
      }
      if (img.complete) {
        if (img.naturalWidth > 0) {
          img.style.display = 'block';
          if (frame) frame.classList.add('has-image');
        } else {
          img.style.display = 'none';
          if (frame) frame.classList.remove('has-image');
        }
      }
    };

    const slotObserver = new MutationObserver((mutations) => {
      mutations.forEach((m) => {
        if (m.type === 'attributes' && m.attributeName === 'src' && m.target instanceof HTMLImageElement) {
          syncCertSlot(m.target);
        }
      });
    });

    certSlots.forEach((img) => {
      img.addEventListener(
        'load',
        () => {
          const frame = img.closest('.cert-frame');
          if (hasValidCertImageSrc(img.getAttribute('src')) && img.naturalWidth > 0) {
            img.style.display = 'block';
            if (frame) frame.classList.add('has-image');
          }
        },
        { signal }
      );
      img.addEventListener(
        'error',
        () => {
          const frame = img.closest('.cert-frame');
          img.style.display = 'none';
          if (frame) frame.classList.remove('has-image');
        },
        { signal }
      );
      slotObserver.observe(img, { attributes: true, attributeFilter: ['src'] });
      syncCertSlot(img);
    });

    routeCleanupFns.push(() => slotObserver.disconnect());
  }

  const badgesContainer = $('badges-grid-container');
  if (badgesContainer) {
    // Capture-phase error fallback so no broken box ever appears
    badgesContainer.addEventListener(
      'error',
      (e) => {
        const target = e.target;
        if (target && target.classList && target.classList.contains('badge-img')) {
          const frame = target.closest('.badge-frame');
          if (frame) frame.classList.add('is-fallback');
        }
      },
      { capture: true, signal }
    );

    if (!isTouchDevice()) {
      badgesContainer.addEventListener(
        'pointermove',
        (e) => {
          if (isTouchDevice() || e.pointerType === 'touch') return;
          const rect = badgesContainer.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          badgesContainer.style.setProperty('--mouse-x', `${x}px`);
          badgesContainer.style.setProperty('--mouse-y', `${y}px`);
        },
        { signal }
      );
    }
  }

  const filterBar = $('badges-filter-bar');
  if (filterBar && badgesContainer) {
    filterBar.addEventListener(
      'click',
      (e) => {
        const btn = e.target.closest('.badge-filter-btn');
        if (!btn) return;
        const selected = btn.dataset.filter || 'ALL';
        filterBar.querySelectorAll('.badge-filter-btn').forEach((b) => {
          const active = b === btn;
          b.classList.toggle('is-active', active);
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        badgesContainer.querySelectorAll('.badge-frame').forEach((frame) => {
          const match = selected === 'ALL' || frame.dataset.category === selected;
          frame.hidden = !match;
        });
      },
      { signal }
    );
  }
}

      });
      if (layerCounter) {
        layerCounter.textContent = `[ LAYER 0${cardsInDeck.length} / 0${cardsInDeck.length} ]`;
      }
    } else {
      const secRect = processSec.getBoundingClientRect();
      const vh = window.innerHeight;
      const scrollable = Math.max(1, processSec.offsetHeight - vh);
      const progress = clamp(-secRect.top / scrollable, 0, 1);

      cardsInDeck.forEach((card, idx) => {
        const { translateYvh, scale, brightness, rotateZdeg } = calcCanvasCardTransform(
          progress,
          idx,
          cardsInDeck.length
        );
        card.style.zIndex = String(idx + 1);
        card.style.transform = `translate3d(0, ${translateYvh}vh, 0) scale(${scale}) rotateZ(${rotateZdeg}deg)`;
        card.style.filter = `brightness(${brightness})`;
      });

      if (layerCounter && cardsInDeck.length) {
        const activeLayer = calcCanvasActiveLayer(progress, cardsInDeck.length);
        const paddedLayer = String(activeLayer).padStart(2, '0');
        const paddedTotal = String(cardsInDeck.length).padStart(2, '0');
        const nextText = `[ LAYER ${paddedLayer} / ${paddedTotal} ]`;
        if (layerCounter.textContent !== nextText) {
          layerCounter.textContent = nextText;
        }
      }
    }
  }

  // 2. Creative Outlets — Poetry & Audio Horizontal Track & Center Cinematic Focus
  const artistrySec = $('about-artistry');
  const artistryTrack = $('artistry-track');
  if (artistrySec && artistryTrack) {
    const frames = artistryTrack.querySelectorAll('.artistry-frame');
    if (window.innerWidth <= 768 || prefersReducedMotion) {
      artistryTrack.style.transform = 'none';
      frames.forEach(frame => {
        frame.style.transform = 'none';
        frame.style.filter = 'grayscale(0%)';
        const overlay = frame.querySelector('.artistry-overlay');
        if (overlay) overlay.style.opacity = '1';
      });
    } else {
      const rect = artistrySec.getBoundingClientRect();
      const vh = window.innerHeight;
      const scrollable = Math.max(1, artistrySec.offsetHeight - vh);
      const progress = clamp(-rect.top / scrollable, 0, 1);
      const maxDistance = Math.max(0, artistryTrack.scrollWidth - window.innerWidth);
      const tx = calcArtistryTrackTranslate(progress, maxDistance);
      artistryTrack.style.transform = `translate3d(${tx.toFixed(2)}px, 0, 0)`;

      const viewportCenter = window.innerWidth / 2;
      const focusRadius = window.innerWidth * 0.45;
      frames.forEach(frame => {
        const fRect = frame.getBoundingClientRect();
        const fCenter = fRect.left + fRect.width / 2;
        const focus = calcArtistryFrameFocus(fCenter - viewportCenter, focusRadius, 0.85, 1.05, 80);
        frame.style.transform = `scale(${focus.scale.toFixed(3)})`;
        frame.style.filter = `grayscale(${focus.grayscale.toFixed(1)}%)`;
        const overlay = frame.querySelector('.artistry-overlay');
        if (overlay) {
          overlay.style.opacity = focus.overlayOpacity.toFixed(2);
        }
      });
    }
  }
}

/* ---------- MAIN ANIMATION LOOP (THROTTLED & ROUTE-AWARE) ---------- */
function loop(time) {
  // If tab is hidden in background, pause execution to conserve battery
  if (isTabHidden) {
    requestAnimationFrame(loop);
    return;
  }

  if (lenis && !prefersReducedMotion) lenis.raf(time);

  updateHorizontalSection();
  updateLiquidReflections(time);
  updateManifestoWords();
  updateMarquee();
  updateMagnetic();

  if (currentPath === '/') {
    updateHomeExtensions();
  } else if (currentPath === '/about') {
    updateTimelineProgress();
    updateSkillsSkew();
    updateAboutExtensions();
  } else if (currentPath === '/work') {
    updateArchiveMagnetic();
    updateHairlineReveals();
  } else if (currentPath === '/credentials') {
    updateCredentialsEffects();
  }

  requestAnimationFrame(loop);
}

// Global uncaught route/runtime fallback hook
window.__vanteAuditTriggerError = (msg = 'Simulated route failure') => {
  renderErrorFallback(new Error(msg), currentPath, false);
};

// Initial boot wrapped in global try...catch error boundary
try {
  initImageProtection();
  initLenis();
  initWebVitals();
  const rawInitial = window.location.pathname || '/';
  const resolvedInitial = resolveRouteKey(rawInitial, Object.keys(routes));
  if (!resolvedInitial) {
    currentPath = rawInitial;
    updateActiveNav('');
    renderErrorFallback(null, rawInitial, true);
  } else {
    currentPath = resolvedInitial;
    document.body.dataset.route = resolvedInitial;
    document.body.dataset.transitioning = 'false';
    routes[resolvedInitial]();
    applyImageProtection(appContainer || document);
    updateActiveNav(resolvedInitial);
    updateSEO(resolvedInitial);
    analytics.onRouteChange(resolvedInitial);
    initRouteEffects(resolvedInitial);
  }
  requestAnimationFrame(loop);
} catch (bootErr) {
  renderErrorFallback(bootErr, window.location.pathname || '/', false);
}
