    <style>
:root{--bg:#0a0a0b;--ink:#f4f1ea;--mid:#8d8b86;--line:rgba(244,241,234,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);overflow-x:clip}
body{font-family:'Inter Tight',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:clip}

/* Image Interaction Protection */
img[data-protected="true"],[data-image-protection="true"],[data-image-protection="true"] img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* Screen reader announcement */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* WebGL fallback */
body.no-webgl #gl{display:none!important}
body.no-webgl .stage{background:radial-gradient(circle at 50% 40%,#1c1c20 0%,#0a0a0b 75%)}

/* Page Transition Curtain */
#transition-curtain{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100svh;background:var(--bg);transform:scaleY(0);transform-origin:bottom;z-index:999;pointer-events:none;will-change:transform}

/* Persistent Header */
.top{position:absolute;left:32px;right:32px;top:26px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;mix-blend-mode:difference;z-index:100;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s ease}
.top.is-fixed{position:fixed}
.top.nav-hidden{transform:translateY(-100%);opacity:0}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:.09em;color:var(--ink);text-decoration:none;pointer-events:auto;border-radius:4px}
.logo:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.logo svg{width:22px;height:18px;fill:var(--ink)}

.nav-links{display:flex;align-items:center;gap:28px;margin-left:48px;pointer-events:auto}
.nav-link{font:400 12px 'IBM Plex Mono',monospace;letter-spacing:.09em;color:var(--ink);text-decoration:none;position:relative;padding:4px 0;transition:color .2s;border-radius:2px}
.nav-link:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.nav-link:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.nav-link:hover:after,.nav-link.active:after{transform:scaleX(1);transform-origin:left}
.nav-link.active{color:var(--ink);font-weight:500}

.acts{margin-left:auto;display:flex;align-items:center;gap:12px;pointer-events:auto}
.acts a,.acts button{display:flex;align-items:center;gap:9px;height:32px;padding:0 15px;border:1px solid rgba(244,241,234,.55);border-radius:99px;color:var(--ink);background:transparent;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.06em;cursor:pointer;transition:background .2s,color .2s;font-family:inherit}
.acts a:focus-visible,.acts button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.acts a:hover,.acts button:hover{background:var(--ink);color:var(--bg)}
.acts a i,.acts button i{width:6px;height:6px;border-radius:50%;background:currentColor}

/* Sleek Hamburger for Mobile */
.hamburger-btn{display:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(244,241,234,.3);background:transparent;cursor:pointer;position:relative;align-items:center;justify-content:center;flex-direction:column;gap:5px;pointer-events:auto}
.hamburger-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.hamburger-btn span{display:block;width:16px;height:1.5px;background:var(--ink);transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s ease}
.hamburger-btn.is-active span:nth-child(1){transform:translateY(3.25px) rotate(45deg)}
.hamburger-btn.is-active span:nth-child(2){transform:translateY(-3.25px) rotate(-45deg)}

/* Full-Screen Mobile Menu */
#mobile-menu{position:fixed;inset:0;background:var(--bg);z-index:990;display:flex;flex-direction:column;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .4s cubic-bezier(.16,1,.3,1)}
#mobile-menu.is-open{opacity:1;pointer-events:auto}
.mobile-nav-list{list-style:none;display:flex;flex-direction:column;gap:3vh}
.mobile-nav-item{overflow:hidden}
.mobile-nav-link{display:inline-block;font-size:clamp(36px,8vw,64px);font-weight:500;letter-spacing:-.04em;color:var(--ink);text-decoration:none;transform:translateY(100%);opacity:0;transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .5s cubic-bezier(.16,1,.3,1),color .2s;border-radius:4px}
.mobile-nav-link:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.mobile-nav-link:hover{color:var(--mid)}
#mobile-menu.is-open .mobile-nav-link{transform:translateY(0);opacity:1}
#mobile-menu.is-open .mobile-nav-item:nth-child(1) .mobile-nav-link{transition-delay:.05s}
#mobile-menu.is-open .mobile-nav-item:nth-child(2) .mobile-nav-link{transition-delay:.12s}
#mobile-menu.is-open .mobile-nav-item:nth-child(3) .mobile-nav-link{transition-delay:.19s}
#mobile-menu.is-open .mobile-nav-item:nth-child(4) .mobile-nav-link{transition-delay:.26s}

/* Hero Section (#track) */
#track{height:900vh;position:relative}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--bg)}
.hl{position:absolute;left:0;right:0;font-weight:400;font-size:clamp(40px,6.7vw,130px);line-height:1;letter-spacing:-.055em;white-space:nowrap;text-align:center;will-change:transform}
#l1{top:calc(50% - .98em)}
#l2{top:calc(50% + .03em)}
#l1 span,#l2 span{display:inline-block}
#l1 span{margin-right:15vw}
#l2 span{margin-left:15vw}
#cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15em;text-align:center;font-size:clamp(9px,.74vw,13px);font-weight:500;line-height:1.3;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .5s cubic-bezier(.16,1,.3,1)}
#glow{position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(rgba(244,241,234,.1),rgba(244,241,234,0))}
#cross{position:absolute;left:32px;right:32px;top:37.5%;height:1px;background:var(--line)}
#cross i{position:absolute;left:50%;top:-.62em;margin-left:-.3em;font:400 13px 'IBM Plex Mono',monospace;color:var(--mid);background:var(--bg);padding:0 .3em;line-height:1.2}
.bot{position:absolute;left:32px;right:32px;bottom:26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;font-size:12.5px;line-height:1.35;pointer-events:none}
.bot p{color:var(--ink);max-width:21em}
.bot .mid{font:400 11.5px 'IBM Plex Mono',monospace;letter-spacing:.06em}
.bot .mid s{text-decoration:none;color:var(--mid);margin:0 .9em}
.bot .r{justify-self:end;display:flex;gap:12px;align-items:center;font:400 11.5px 'IBM Plex Mono',monospace;letter-spacing:.06em}
.bot .r:after{content:"";width:22px;height:1px;background:var(--ink)}
#rule{position:absolute;left:3.5vw;right:3.5vw;top:50%;height:1px;background:var(--line);transform-origin:left;transform:scaleX(0)}

/* Section 02 - Kinetic Horizontal Scroll Selected Works (Home Route) */
#index{height:540vh;position:relative;background:var(--bg);color:var(--ink);z-index:10}
.horizontal-sticky-wrap{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;align-items:center}
.sec-header-sticky{position:absolute;top:92px;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center;z-index:20;pointer-events:none}
.sec-header-sticky .sec-label{margin:0;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--mid);text-transform:uppercase}
.horizontal-indicator{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);display:flex;align-items:center;gap:14px}
.horizontal-counter{color:var(--ink);font-weight:500}
.horizontal-progress-bar{width:68px;height:1px;background:var(--line);position:relative;overflow:hidden}
.horizontal-progress-fill{position:absolute;top:0;left:0;height:100%;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);will-change:transform}
.horizontal-track{display:flex;align-items:center;padding:0 10vw;gap:15vw;width:max-content;will-change:transform;perspective:1000px}

/* Work Card Architecture & 3D Tilt */
.work-card{width:45vw;aspect-ratio:16/9;position:relative;perspective:1000px;flex-shrink:0;cursor:pointer;border-radius:6px;outline:none;user-select:none}
.work-card:focus-visible .card-inner{outline:2px solid var(--ink);outline-offset:6px}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(calc(var(--mouse-y, 0) * 5deg)) rotateY(calc(var(--mouse-x, 0) * 5deg));transition:transform .08s ease-out;border-radius:6px;overflow:hidden;background:#141417;border:1px solid rgba(244,241,234,.12);box-shadow:0 30px 80px rgba(0,0,0,.65)}
.work-card.is-resetting .card-inner{transition:transform .6s cubic-bezier(.16,1,.3,1)!important}
.card-img-wrap{width:100%;height:100%;overflow:hidden;position:relative}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform .8s cubic-bezier(.16,1,.3,1),filter .4s ease;filter:brightness(.92) contrast(1.04)}
.work-card:hover .card-img-wrap img{transform:scale(1.07);filter:brightness(1) contrast(1.02)}
.card-top-tag{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none}
.card-num{font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ink);background:rgba(10,10,11,.75);backdrop-filter:blur(8px);padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.card-category{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);background:rgba(10,10,11,.75);backdrop-filter:blur(8px);padding:4px 12px;border-radius:99px;border:1px solid var(--line);text-transform:uppercase}

/* Massive Typography Superimposed Over Bottom Edge */
.card-bottom-typography{position:absolute;bottom:-2.5vw;left:-2vw;z-index:5;pointer-events:none;line-height:.9}
.card-title-massive{font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;font-size:clamp(38px,6vw,92px);letter-spacing:-.045em;color:var(--ink);margin:0;white-space:nowrap;text-shadow:0 4px 30px rgba(0,0,0,.85);transition:color .3s}
.work-card:hover .card-title-massive{color:#ffffff}
.card-subtext{font:400 11.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);margin-top:6px;padding-left:4px;text-transform:uppercase}
.card-desc{font:400 12.5px/1.5 'IBM Plex Mono',monospace;letter-spacing:.03em;color:#b4b1a8;margin-top:8px;max-width:34vw;text-transform:none}

/* WebGL Liquid Floor Reflections */
.card-reflection{position:absolute;inset:0;width:100%;height:100%;transform:scaleY(-1) translateY(-100%);opacity:.4;pointer-events:none;overflow:hidden;border-radius:6px;filter:url(#liquid-reflection) blur(.5px);mask-image:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 75%);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,0) 75%)}
.card-reflection img{width:100%;height:100%;object-fit:cover}
.card-reflection .reflection-text{position:absolute;bottom:-2.5vw;left:-2vw;font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;font-size:clamp(38px,6vw,92px);letter-spacing:-.045em;color:var(--ink);line-height:.9;white-space:nowrap}


/* Section 03 - Studio Philosophy (Manifesto) */
#manifesto{background:var(--ink);color:var(--bg);padding:20vh 32px;position:relative;z-index:10;display:flex;align-items:center;justify-content:center;min-height:85vh}
.manifesto-wrap{max-width:1160px;margin:0 auto}
.manifesto-text{font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;font-size:clamp(30px,4vw,70px);line-height:1.15;letter-spacing:-.03em;color:var(--bg)}
.word-mask{overflow:hidden;display:inline-block;vertical-align:top;margin-right:.28em}
.word{transform:translateY(110%);opacity:0;transform-origin:bottom left;display:inline-block;transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .6s cubic-bezier(.16,1,.3,1);will-change:transform,opacity}

/* Work Route: Redesigned Staggered Parallax Gallery */
.work-page{padding-top:16vh;min-height:100vh;min-height:100svh}
.work-header{padding:0 4vw 6vh;max-width:1440px}
.work-header h1{font-size:clamp(40px,7vw,110px);font-weight:500;letter-spacing:-.05em;line-height:1;margin-top:16px;outline:none}
.gallery-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2.5vw;padding:4vh 4vw 16vh;max-width:1600px;margin:0 auto}

.gallery-card{position:relative;cursor:pointer;border-radius:6px;outline:none}
.gallery-card:focus-visible .project-frame{outline:2px solid var(--ink);outline-offset:4px}
.gallery-card.span-7{grid-column:span 7;margin-top:0}
.gallery-card.span-5{grid-column:span 5;margin-top:20vh}
.gallery-card.span-6-neg{grid-column:span 6;margin-top:-10vh}
.gallery-card.span-6-pos{grid-column:span 6;margin-top:15vh}

.project-frame{overflow:hidden;border-radius:4px;aspect-ratio:4/3;position:relative;background:#141417;border:1px solid rgba(244,241,234,.08)}
.project-frame img{height:120%;width:100%;object-fit:cover;position:absolute;top:-10%;left:0;will-change:transform;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.gallery-card:hover .project-frame img{transform:scale(1.05)}
.project-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,11,.92) 0%,rgba(10,10,11,.3) 45%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;opacity:0;transition:opacity .4s cubic-bezier(.16,1,.3,1);z-index:2}
.gallery-card:hover .project-overlay,.gallery-card:focus-visible .project-overlay{opacity:1}
.project-info{transform:translateY(20px);opacity:0;transition:transform .4s cubic-bezier(.16,1,.3,1),opacity .4s cubic-bezier(.16,1,.3,1)}
.gallery-card:hover .project-info,.gallery-card:focus-visible .project-info{transform:translateY(0);opacity:1}
.project-title{font-size:clamp(22px,2.2vw,36px);font-weight:500;letter-spacing:-.03em;color:var(--ink);margin-bottom:6px}
.project-cat{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}

/* About Route */
.about-page{padding:18vh 4vw 12vh;max-width:1440px;margin:0 auto}
.about-split{display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:start;margin-bottom:0}
.clip-reveal{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:0;border:1px solid var(--line);background:#141417;clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%);transition:clip-path 1.2s cubic-bezier(.16,1,.3,1);will-change:clip-path}
.clip-reveal.is-revealed{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.clip-reveal img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.about-bio{color:var(--ink);display:flex;flex-direction:column;gap:0}
.founder-eyebrow{font:400 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink);text-transform:uppercase}
.founder-headline{font:500 clamp(36px,5vw,82px)/.96 'Inter Tight',system-ui,sans-serif;letter-spacing:-.04em;color:var(--ink);margin:1.6vh 0 0;outline:none}
.founder-tagline{font:400 12px/1.5 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;margin:2vh 0 3vh;padding-bottom:2.4vh;border-bottom:1px solid var(--line)}
.founder-narrative{display:flex;flex-direction:column;gap:2.4vh}
.founder-block-tag{font:400 10.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;margin-bottom:.6vh;display:block}
.about-bio p{font:400 clamp(14px,1.15vw,17px)/1.65 'Inter Tight',system-ui,sans-serif;color:#d5d2cb;margin:0}
.about-bio strong{color:var(--ink);font-weight:600}
.brand-ai-red{color:#FF0000}

/* About Route: AIVERSEUI Narrative Architecture */
.aiverseui-sec{margin-top:11vh;padding-top:2vh}
.pillars-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--bg);margin-top:3vh}
.pillar-cell{padding:3.5vh 2vw;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;display:flex;flex-direction:column;justify-content:space-between;gap:2.6vh;transition:background .3s ease}
.pillar-cell:hover{background:#111114}
.pillar-num{font:400 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);display:block;margin-bottom:1vh}
.pillar-title{font:500 clamp(20px,1.7vw,26px)/1.15 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);margin:0 0 1.4vh}
.pillar-desc{font:400 13.5px/1.55 'Inter Tight',system-ui,sans-serif;color:#b8b5ad;margin:0}
.pillar-list{list-style:none;padding:2vh 0 0;margin:0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.8vh}
.pillar-list li{font:400 11px/1.45 'IBM Plex Mono',monospace;letter-spacing:.04em;color:var(--mid);display:flex;align-items:baseline;gap:8px}
.pillar-list li::before{content:'—';color:rgba(244,241,234,.35);flex-shrink:0}

.approach-pipeline{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--bg);margin-top:3vh}
.approach-step{padding:2.6vh 1.6vw;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;display:flex;flex-direction:column;justify-content:space-between;gap:1vh;transition:background .3s ease}
.approach-step:hover{background:#121215}
.approach-step-code{font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.approach-step-label{font:500 clamp(13px,1.05vw,16px)/1.2 'IBM Plex Mono',monospace;letter-spacing:.05em;color:var(--ink);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.approach-statement{margin-top:3vh;font:400 clamp(15px,1.25vw,18px)/1.65 'Inter Tight',system-ui,sans-serif;color:#d5d2cb;max-width:74ch}

.matrix-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:3vh}
.matrix-col{padding:4vh 2.4vw;border-right:1px solid var(--line);border-radius:0;display:flex;flex-direction:column;gap:1.6vh}
.matrix-col:first-child{padding-left:0}
.matrix-col:last-child{border-right:none;padding-right:0}
.matrix-tag{font:400 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);text-transform:uppercase}
.matrix-title{font:500 clamp(22px,2vw,30px)/1.15 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);margin:0}
.matrix-body{font:400 14px/1.6 'Inter Tight',system-ui,sans-serif;color:#c7c4bc;margin:0}

.principles-grid{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin-top:3vh}
.principle-card{padding:3vh 1.6vw;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);border-radius:0;display:flex;flex-direction:column;justify-content:space-between;gap:1.8vh;opacity:0;transform:translateY(22px);transition:opacity .65s cubic-bezier(.16,1,.3,1),transform .65s cubic-bezier(.16,1,.3,1),background .3s ease}
.principle-card.is-revealed{opacity:1;transform:translateY(0)}
.principle-card.is-revealed:hover{transform:translateY(-4px);background:#121215;transition-delay:0ms!important}
.principle-num{font:400 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid)}
.principle-title{font:500 clamp(15px,1.15vw,18px)/1.25 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink);text-transform:uppercase;margin:0}
.principle-desc{font:400 12.5px/1.55 'Inter Tight',system-ui,sans-serif;color:var(--mid);margin:0}

/* Infinite Scroll Marquee */
.marquee-container{width:100vw;margin-left:calc(-50vw + 50%);overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:2.5vh 0;user-select:none}
.marquee-track{display:inline-flex;white-space:nowrap;will-change:transform}
.marquee-text{font:500 clamp(20px,2.4vw,36px) 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ink);display:inline-block;padding-right:2vw}

/* Contact Drawer */
#contact-drawer{position:fixed;top:0;right:0;width:min(500px,100vw);height:100vh;height:100svh;background:var(--bg);border-left:1px solid var(--line);z-index:1000;transform:translateX(100%);transition:transform .5s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;justify-content:space-between;padding:40px 32px;overflow-y:auto}
#contact-drawer.is-open{transform:translateX(0)}
#contact-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:995;opacity:0;pointer-events:none;transition:opacity .4s ease}
#contact-backdrop.is-open{opacity:1;pointer-events:auto}
.drawer-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.drawer-title{font-size:24px;font-weight:500;letter-spacing:-.02em}
.drawer-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:16px;transition:background .2s,color .2s}
.drawer-close:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.drawer-close:hover{background:var(--ink);color:var(--bg)}
.drawer-form{display:flex;flex-direction:column;gap:20px;flex:1}
.drawer-field{display:flex;flex-direction:column;gap:8px}
.drawer-field label{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid)}
.drawer-field input,.drawer-field textarea{background:#121214;border:1px solid var(--line);border-radius:4px;padding:12px 14px;color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s}
.drawer-field input:focus,.drawer-field textarea:focus{border-color:var(--ink)}
.drawer-submit{height:46px;background:var(--ink);color:var(--bg);border:none;border-radius:99px;font-weight:600;font-size:13px;letter-spacing:.05em;cursor:pointer;transition:opacity .2s;margin-top:10px}
.drawer-submit:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.drawer-submit:hover{opacity:.9}
.drawer-footer{margin-top:32px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;font:400 12px 'IBM Plex Mono',monospace;color:var(--mid)}
.drawer-footer a{color:var(--ink);text-decoration:none;border-radius:2px}
.drawer-footer a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Section 04 - Footer */
#vante-footer{background:var(--bg);color:var(--ink);min-height:100vh;min-height:100svh;height:100vh;height:100svh;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:10;padding:0;overflow:hidden}
.footer-top{padding:32px;display:flex;justify-content:space-between;align-items:flex-start}
.footer-status{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);max-width:260px;line-height:1.6}
.footer-socials{display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em}
.footer-socials a{color:var(--ink);text-decoration:none;transition:color .2s;border-radius:2px}
.footer-socials a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.footer-socials a:hover{color:var(--mid)}
.footer-center{display:flex;align-items:center;justify-content:center;flex:1}
.magnetic-btn{width:160px;height:160px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--ink);background:transparent;text-decoration:none;cursor:pointer;position:relative;will-change:transform;transition:border-color .3s,background .3s,color .3s}
.magnetic-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.magnetic-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.magnetic-text{display:inline-block;pointer-events:none;will-change:transform}
.footer-bottom{width:100vw;height:auto;display:flex;align-items:flex-end;pointer-events:none}
.footer-bottom svg{width:100%;height:auto;max-height:28vh;display:block}

/* Contact Page (/contact) */
.contact-page{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--ink);position:relative;display:flex;flex-direction:column;overflow-x:clip}
.contact-telemetry{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16vh 4vw 3vh;border-bottom:1px solid var(--line);font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.contact-clock{color:var(--ink)}
.contact-status-pill{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.contact-pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--ink);display:inline-block;animation:contactStatusPulse 1.8s ease-in-out infinite}
@keyframes contactStatusPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.contact-headline-wrap{padding:6vh 4vw;border-bottom:1px solid var(--line)}
.contact-display-title{font:500 clamp(42px,7.2vw,124px) 'Inter Tight',system-ui,sans-serif;line-height:.96;letter-spacing:-.05em;color:var(--ink);margin:0;outline:none}
.contact-title-mask{display:block;overflow:hidden}
.contact-title-line{display:block;transform:translateY(110%);transition:transform .9s cubic-bezier(.16,1,.3,1);will-change:transform}
.contact-title-mask:nth-child(2) .contact-title-line{transition-delay:.07s}
.contact-title-mask:nth-child(3) .contact-title-line{transition-delay:.14s}
.contact-page.is-entered .contact-title-line{transform:translateY(0)}

.contact-workspace{display:grid;grid-template-columns:1.35fr 1fr;flex:1;border-bottom:1px solid var(--line)}
.contact-composer{padding:5vh 4vw 6vh;position:relative;display:flex;flex-direction:column}
.contact-scope-head{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;margin-bottom:18px}
.contact-scope-pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:4.5vh}
.contact-scope-pill{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .25s cubic-bezier(.16,1,.3,1),color .25s cubic-bezier(.16,1,.3,1),border-color .25s,transform .18s cubic-bezier(.16,1,.3,1)}
.contact-scope-pill:hover{border-color:var(--ink)}
.contact-scope-pill:active{transform:scale(.95)}
.contact-scope-pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.contact-scope-pill:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

.contact-form{transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}
.contact-form.is-leaving{opacity:0;transform:translateY(-16px);pointer-events:none}
.contact-form.is-hidden{display:none}
.field-wrap{position:relative;margin-bottom:3.4vh}
.field-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.16,1,.3,1);pointer-events:none}
.field-wrap:focus-within::after{transform:scaleX(1)}
.field-label{display:block;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;transition:color .3s ease}
.field-wrap:focus-within .field-label{color:var(--ink)}
.field-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:2.2vh 0;color:var(--ink);font:400 16px/1.5 'Inter Tight',system-ui,sans-serif;outline:none;border-radius:0;resize:vertical}
.field-input::placeholder{color:rgba(141,139,134,.55)}
.contact-form-error{font:400 11.5px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#ff6b6b;margin-bottom:18px;min-height:18px}

.contact-submit-wrap{padding-top:1vh}
.contact-submit-btn{width:100%;padding:22px 28px;border:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);font:500 12.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;transition:color .35s cubic-bezier(.16,1,.3,1),transform .18s ease-out;will-change:transform}
.contact-submit-btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .45s cubic-bezier(.16,1,.3,1);z-index:0}
.contact-submit-btn:hover::before,.contact-submit-btn:focus-visible::before{transform:translateY(0)}
.contact-submit-btn:hover,.contact-submit-btn:focus-visible{color:var(--bg)}
.contact-submit-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.contact-submit-label{position:relative;z-index:1;pointer-events:none}

.contact-receipt{border:1px solid var(--line);padding:4vh 3vw;background:rgba(244,241,234,.025);opacity:0;transform:translateY(16px);transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);display:none}
.contact-receipt.is-visible{display:block}
.contact-receipt.is-entered{opacity:1;transform:translateY(0)}
.contact-receipt-kicker{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink);text-transform:uppercase;margin-bottom:14px}
.contact-receipt-ref{font:500 clamp(22px,2.4vw,34px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink);margin-bottom:24px}
.contact-receipt-grid{display:grid;gap:14px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:26px}
.contact-receipt-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:400 12px 'IBM Plex Mono',monospace;letter-spacing:.06em}
.contact-receipt-key{color:var(--mid);text-transform:uppercase}
.contact-receipt-val{color:var(--ink)}
.contact-receipt-scopes{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.contact-receipt-scope-tag{padding:6px 12px;border:1px solid var(--line);font:400 10.5px 'IBM Plex Mono',monospace;letter-spacing:.07em;color:var(--ink);text-transform:uppercase}
.contact-reset-btn{padding:14px 22px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:500 11.5px 'IBM Plex Mono',monospace;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
.contact-reset-btn:hover,.contact-reset-btn:focus-visible{background:var(--ink);color:var(--bg)}
.contact-reset-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

.contact-channels{border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.contact-social-list{display:flex;flex-direction:column}
.contact-social-row{padding:3.2vh 3vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;text-decoration:none;color:var(--ink)}
.contact-social-row::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .45s cubic-bezier(.16,1,.3,1);z-index:0}
.contact-social-row:hover::before,.contact-social-row:focus-visible::before{transform:translateY(0)}
.contact-social-row:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.contact-social-meta{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.contact-social-role{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;transition:color .35s ease}
.contact-social-name{font:500 24px 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink);transition:transform .4s cubic-bezier(.16,1,.3,1),color .35s ease}
.contact-social-arrow{position:relative;z-index:1;font:400 22px 'IBM Plex Mono',monospace;color:var(--ink);transition:transform .4s cubic-bezier(.16,1,.3,1),color .35s ease}
.contact-social-row:hover .contact-social-role,.contact-social-row:focus-visible .contact-social-role{color:rgba(10,10,11,.65)}
.contact-social-row:hover .contact-social-name,.contact-social-row:focus-visible .contact-social-name{color:var(--bg);transform:translateX(10px)}
.contact-social-row:hover .contact-social-arrow,.contact-social-row:focus-visible .contact-social-arrow{color:var(--bg);transform:rotate(45deg)}

.contact-location-block{padding:3.5vh 3vw;display:flex;flex-direction:column;gap:14px;margin-top:auto}
.contact-coords{font:400 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.contact-direct-mail{font:400 12px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--ink);text-decoration:none;width:fit-content;border-bottom:1px solid var(--line);padding-bottom:4px;transition:border-color .2s}
.contact-direct-mail:hover,.contact-direct-mail:focus-visible{border-color:var(--ink)}
.contact-direct-mail:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.contact-copy-btn{width:fit-content;margin-top:4px;padding:12px 20px;border:1px solid var(--line);background:transparent;color:var(--ink);font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
.contact-copy-btn:hover,.contact-copy-btn.is-copied,.contact-copy-btn:focus-visible{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.contact-copy-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

/* Section A: Interactive Timeline (/about) */
#about-timeline{position:relative;width:100%;margin-top:12vh;overflow-x:clip}
.timeline-container{position:relative;min-height:200vh;max-width:1200px;margin:0 auto;padding:10vh 24px}
.timeline-rail{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line);transform:translateX(-50%)}
.timeline-progress-line{position:absolute;left:50%;top:0;width:2px;height:0%;background:var(--ink);transform:translateX(-50%);will-change:height;transition:height .05s linear}
.timeline-item{position:relative;margin-bottom:28vh;width:44%}
.timeline-item.item-left{margin-right:auto;text-align:right;transform:translateX(-50px);opacity:0;transition:transform .8s cubic-bezier(.16,1,.3,1),opacity .8s ease}
.timeline-item.item-right{margin-left:auto;text-align:left;transform:translateX(50px);opacity:0;transition:transform .8s cubic-bezier(.16,1,.3,1),opacity .8s ease}
.timeline-item.in-view{transform:translateX(0);opacity:1}
.timeline-node{position:absolute;top:10px;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);will-change:transform;z-index:2;transition:transform .6s cubic-bezier(.16,1,.3,1),box-shadow .3s}
.timeline-item.item-left .timeline-node{right:-7px;transform:translate(50%,0) scale(0)}
.timeline-item.item-left.in-view .timeline-node{transform:translate(50%,0) scale(1);box-shadow:0 0 14px rgba(245,245,247,.7)}
.timeline-item.item-right .timeline-node{left:-7px;transform:translate(-50%,0) scale(0)}
.timeline-item.item-right.in-view .timeline-node{transform:translate(-50%,0) scale(1);box-shadow:0 0 14px rgba(245,245,247,.7)}
.timeline-year{font:400 12px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);margin-bottom:8px}
.timeline-title{font:500 clamp(20px,2.2vw,32px) 'Inter Tight',system-ui,sans-serif;color:var(--ink);letter-spacing:-.02em;line-height:1.25}
.timeline-desc{font:400 13px 'IBM Plex Mono',monospace;color:#a5a29a;margin-top:10px;line-height:1.6}

/* Section B: Kinetic Skills Grid (/about) */
#about-skills{padding:12vh 0 16vh;max-width:1440px;margin:0 auto}
.skills-heading{font:500 clamp(26px,3vw,44px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;margin:20px 0 44px;color:var(--ink)}
.skills-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;will-change:transform;transform-origin:center center}
.skill-card{border:1px solid var(--line);padding:3.5vh 2vw;background:transparent;color:var(--ink);min-height:160px;display:flex;flex-direction:column;justify-content:space-between;border-radius:2px;transition:background .3s cubic-bezier(.16,1,.3,1),color .3s cubic-bezier(.16,1,.3,1),border-color .3s;cursor:default}
.skill-card:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skill-card-top{display:flex;justify-content:space-between;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;opacity:.7;transition:color .3s}
.skill-name{font:500 clamp(20px,2.2vw,32px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;transition:color .3s}
.skill-card:hover .skill-card-top,.skill-card:hover .skill-name{color:var(--bg)}

/* Section 01: 3D Rotating Architectural Cylinder Carousel (<section id="event-wall">) */
#event-wall{height:450vh;position:relative;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cylinder-stage{position:sticky;top:0;height:100vh;height:100svh;width:100vw;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:4vh 4vw;perspective:1600px}
.cylinder-telemetry{display:flex;justify-content:space-between;align-items:center;z-index:20;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em}
.cylinder-telemetry-title{color:var(--mid);text-transform:uppercase}
#cylinder-counter{color:var(--ink)}
.cylinder-ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.cylinder-frame{width:clamp(280px,34vw,540px);aspect-ratio:16/10;position:absolute;left:0;top:0;margin-left:calc(clamp(280px,34vw,540px) / -2);margin-top:calc((clamp(280px,34vw,540px) * 0.625) / -2);border-radius:0!important;border:1px solid var(--line);background:#121214;overflow:hidden;backface-visibility:visible;transition:border-color .4s ease;outline:none;cursor:pointer}
.cylinder-frame:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-color:var(--ink)}
.cylinder-index{position:absolute;top:0;left:0;padding:5px 9px;background:rgba(10,10,11,0.8);color:var(--ink);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;z-index:2;pointer-events:none}
.cylinder-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.16,1,.3,1);border-radius:0!important}
.cylinder-frame:hover .cylinder-img,.cylinder-frame:focus-visible .cylinder-img{transform:scale(1.06)}
.cylinder-rail{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:2vh;z-index:20;font:400 10px 'IBM Plex Mono',monospace;color:var(--mid)}
.cylinder-tick{background:none;border:none;padding:4px 6px;font:inherit;letter-spacing:.08em;color:inherit;cursor:pointer;transition:color .25s ease}
.cylinder-tick:hover,.cylinder-tick:focus-visible{color:var(--ink)}
.cylinder-tick:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.cylinder-tick.is-active{color:var(--ink)}

/* Section: Community Partners & Collaborations (<section id="community-partners">) */
#community-partners{padding:15vh 4vw;background:var(--bg);position:relative;border-top:1px solid var(--line)}
.partners-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6vh;border-bottom:1px solid var(--line);padding-bottom:18px}
.partners-header-sub{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.partners-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1.5vw;width:100%}
.partner-card{aspect-ratio:1/2.2;background:#ffffff;color:#000000;border-radius:0!important;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;outline:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12),0 12px 32px rgba(0,0,0,0.35);transform-origin:bottom;opacity:0;transform:translateY(10vh) scaleY(0.8);transition:opacity 0.8s cubic-bezier(.16,1,.3,1),transform 0.8s cubic-bezier(.16,1,.3,1),box-shadow 0.3s cubic-bezier(.16,1,.3,1);will-change:transform,opacity,box-shadow}
.partner-card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.partner-card.is-revealed{opacity:1;transform:translateY(0) scaleY(1)}
.partner-card:hover{box-shadow:inset 0 0 0 2px #000000,0 20px 48px rgba(0,0,0,0.55)}
.partner-top-section{padding:18px 1.2vw 12px;flex:1;display:flex;align-items:flex-start;overflow:hidden}
.partner-vertical-text{writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);transform-origin:center center;display:flex;align-items:flex-start;gap:8px;height:100%;transition:transform 0.4s cubic-bezier(.16,1,.3,1);will-change:transform}
.partner-card:hover .partner-vertical-text{transform:rotate(180deg) translateY(10px)}
.partner-name{font:600 clamp(14px,1.2vw,19px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;color:#000000;white-space:nowrap;line-height:1}
.partner-meta{font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.07em;color:#555555;text-transform:uppercase;white-space:nowrap;margin-top:2px}
.partner-year{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#000000;margin-top:auto}
.partner-logo-wrap{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;background:#ececed;border-top:1px solid rgba(0,0,0,0.1)}
.partner-logo-img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:block;filter:grayscale(100%) contrast(1.2);transition:filter 0.4s cubic-bezier(.16,1,.3,1),transform 0.4s cubic-bezier(.16,1,.3,1)}
.partner-card:hover .partner-logo-img{filter:grayscale(0%);transform:scale(1.05)}




/* Section 02: Field Operations & Community Impact (<section id="community-impact">) */
#community-impact{padding:14vh 4vw;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;background:var(--bg);overflow:hidden}
.impact-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3.5vw;position:relative}
.impact-card{display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line);padding-left:2vw}
.impact-card:first-child{border-left:none;padding-left:0}
.impact-number{font:500 clamp(48px,6vw,90px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);line-height:1}
.impact-label{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);line-height:1.6;text-transform:uppercase}
.impact-hairline{width:100%;height:1px;background:var(--line);margin:3vh 0 6vh;transform-origin:left;will-change:transform}

/* Magnetic Archive CTA (/work) */
#work-cta{padding:10vh 5vw 12vh;position:relative;width:100%;overflow:hidden}
.work-cta-wrap{display:flex;align-items:center;justify-content:center;min-height:36vh;text-align:center}
.work-cta-link{text-decoration:none;color:var(--ink);display:inline-block;will-change:transform;padding:24px 32px;border:1px solid transparent;border-radius:4px;transition:border-color .3s}
.work-cta-link:focus-visible{outline:2px solid var(--ink);outline-offset:8px}
.work-cta-link:hover{border-color:var(--line)}
.work-cta-text{font:600 clamp(40px,8vw,120px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;line-height:1.05;text-transform:uppercase;color:var(--ink);display:inline-block}

/* Work Page Hero Header & Named 4x2 Capability Map (/work) */
.work-kinetic-page .sec-label{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.work-hero-header{padding:18vh 4vw 6vh;border-bottom:1px solid var(--line);background:var(--bg);width:100%}
.work-hero-eyebrow{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;margin-bottom:2vh}
.work-hero-title{font:500 clamp(42px,7.2vw,124px)/0.95 'Inter Tight',system-ui,sans-serif;letter-spacing:-.05em;color:var(--ink);margin:0;outline:none;text-transform:uppercase}
.capability-header-bar{padding:4vh 4vw 2.5vh;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:var(--bg)}
.capability-header-tag{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
#cap-gesture-status{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;font-variant-numeric:tabular-nums}

/* Capability Matrix: 4x2 3D Architectural Monolith Blades (/work) */
#capability-map{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);perspective:1400px;margin-top:0;width:100%}
.cap-blade{border-radius:0;background:var(--bg);min-height:290px;padding:3vh 2vw;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;transform-style:preserve-3d;cursor:pointer;user-select:none;touch-action:pan-y;outline:none;opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(32px);transition:opacity .8s cubic-bezier(.16,1,.3,1),clip-path .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);will-change:transform,opacity,clip-path}
.cap-blade.is-revealed{opacity:1;clip-path:inset(0% 0 0 0);transform:translateY(0)}
.cap-blade.is-interactive{transition-delay:0ms!important}
.cap-blade:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;z-index:4}
.cap-blade.is-dragging{z-index:6}
.cap-curtain{position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .55s cubic-bezier(.16,1,.3,1);z-index:0;pointer-events:none}
.cap-sheen{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .3s ease;background:radial-gradient(circle 260px at var(--mx,50%) var(--my,50%),rgba(244,241,234,.12),transparent 60%)}
.cap-index-bg{position:absolute;top:calc(3vh + 38px);right:1.8vw;font:500 clamp(54px,5vw,88px)/.85 'Inter Tight',system-ui,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(244,241,234,.14);pointer-events:none;z-index:1;transition:-webkit-text-stroke .45s ease,transform .6s cubic-bezier(.16,1,.3,1);user-select:none}
.cap-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:2}
.cap-cluster{font:400 10px/1.4 'IBM Plex Mono',monospace;color:var(--mid);letter-spacing:.08em;text-transform:uppercase;transition:color .45s ease}
.cap-arrow-badge{width:28px;height:28px;border:1px solid var(--line);display:grid;place-items:center;font:400 12px 'IBM Plex Mono',monospace;color:var(--ink);flex-shrink:0;transition:border-color .45s ease,color .45s ease}
.cap-arrow-glyph{display:inline-block;transition:transform .45s cubic-bezier(.16,1,.3,1)}
.cap-bottom-row{position:relative;z-index:2;margin-top:auto;padding-top:6vh}
.cap-title{font:500 clamp(20px,1.75vw,26px)/1.12 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);margin:0;transition:color .45s ease,transform .45s cubic-bezier(.16,1,.3,1)}
.cap-copy{font:400 13px/1.5 'Inter Tight',system-ui,sans-serif;color:var(--mid);margin:1vh 0 0;min-height:4.5em;transition:color .45s ease}
.cap-bar{position:absolute;bottom:0;left:0;width:100%;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.16,1,.3,1),background .45s ease;z-index:3}
.cap-blade:focus-visible .cap-curtain{transform:translateY(0%)}
.cap-blade:focus-visible .cap-cluster,.cap-blade:focus-visible .cap-copy{color:rgba(10,10,11,.72)}
.cap-blade:focus-visible .cap-title{color:var(--bg)}
.cap-blade:focus-visible .cap-arrow-badge{border-color:rgba(10,10,11,.35);color:var(--bg)}
.cap-blade:focus-visible .cap-arrow-glyph{transform:rotate(45deg)}
.cap-blade:focus-visible .cap-index-bg{-webkit-text-stroke:1px rgba(10,10,11,.18);transform:translateY(-6px)}
.cap-blade:focus-visible .cap-bar{background:var(--bg);transform:scaleX(1)}
@media (hover: hover){
  .cap-blade:hover{z-index:4}
  .cap-blade:hover .cap-curtain{transform:translateY(0%)}
  .cap-blade:hover .cap-sheen{opacity:1}
  .cap-blade:hover .cap-cluster,.cap-blade:hover .cap-copy{color:rgba(10,10,11,.72)}
  .cap-blade:hover .cap-title{color:var(--bg)}
  .cap-blade:hover .cap-arrow-badge{border-color:rgba(10,10,11,.35);color:var(--bg)}
  .cap-blade:hover .cap-arrow-glyph{transform:rotate(45deg)}
  .cap-blade:hover .cap-index-bg{-webkit-text-stroke:1px rgba(10,10,11,.18);transform:translateY(-6px)}
  .cap-blade:hover .cap-bar{background:var(--bg);transform:scaleX(1)}
}

/* Reusable Infinite Ecosystem Marquee Strip (/work & sub-pages) */
.marquee-strip{width:100%;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:3vh 0;background:var(--bg);display:flex;user-select:none}
#capability-map + .marquee-strip{margin-top:clamp(64px,8vh,110px);margin-bottom:clamp(48px,6vh,80px);border-top:1px solid var(--line)}
.marquee-scroller{display:flex;flex-shrink:0;width:max-content;animation:marqueeScroll 28s linear infinite;will-change:transform}
.marquee-strip:hover .marquee-scroller{animation-play-state:paused}
.marquee-strip .marquee-track{display:flex;align-items:center;flex-shrink:0;white-space:nowrap}
.marquee-item{display:inline-flex;align-items:center;justify-content:center;margin-right:5.5vw;flex-shrink:0}
.marquee-logo{height:30px;width:auto;flex-shrink:0;display:block;transition:transform .35s cubic-bezier(.16,1,.3,1),filter .35s ease;will-change:transform,filter}
@media (hover: hover){
  .marquee-item:hover .marquee-logo,.marquee-logo:hover{transform:scale(1.18);filter:drop-shadow(0 0 12px var(--brand-glow,rgba(244,241,234,.45)))}
}
@keyframes marqueeScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* Dedicated /work Showcase Sub-Pages */
.subpage-root{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--ink);padding-top:92px}
.subpage-topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,11,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 4vw;display:flex;justify-content:space-between;align-items:center;gap:16px;transition:top .35s cubic-bezier(.16,1,.3,1)}
body.fixed-nav-visible .subpage-topbar{top:74px}
.subpage-back-btn{display:inline-flex;align-items:center;gap:8px;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink);text-decoration:none;text-transform:uppercase;padding:8px 14px;border:1px solid var(--line);transition:background .25s,color .25s,border-color .25s}
.subpage-back-btn:hover,.subpage-back-btn:focus-visible{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subpage-back-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.subpage-route-tag{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.subpage-hero{padding:8vh 4vw 6vh}
.subpage-kicker{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);text-transform:uppercase;margin-bottom:2.2vh}
.subpage-hero-title{font:500 clamp(32px,4.8vw,74px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.04em;line-height:1.02;color:var(--ink);max-width:22ch;outline:none;margin:0}
.subpage-hero-sub{font:400 13px/1.6 'IBM Plex Mono',monospace;color:var(--mid);max-width:64ch;margin-top:2vh}

/* Sub-Page 01: Systems Grid (12 Frames) */
.systems-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;padding:6vh 4vw 10vh}
.systems-card{border:1px solid var(--line);border-radius:0;background:#0e0e10;display:flex;flex-direction:column;opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1),border-color .3s ease;will-change:transform,opacity}
.systems-card.is-revealed{opacity:1;transform:translateY(0)}
.systems-card:hover{border-color:var(--ink)}
.systems-media{aspect-ratio:16/10;width:100%;overflow:hidden;background:#141417;border-bottom:1px solid var(--line);position:relative}
.systems-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.systems-card:hover .systems-media img{transform:scale(1.05)}
.systems-num-tag{position:absolute;top:0;left:0;padding:5px 10px;background:rgba(10,10,11,.85);color:var(--ink);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.08em}
.systems-body{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.systems-title{font:500 20px 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink);margin:0}
.systems-tags{display:flex;flex-wrap:wrap;gap:6px}
.systems-tag{padding:4px 8px;border:1px solid var(--line);font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--mid);text-transform:uppercase}
.systems-link{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:inline-flex;justify-content:space-between;align-items:center;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ink);text-decoration:none;text-transform:uppercase;transition:color .2s}
.systems-link:hover,.systems-link:focus-visible{color:var(--mid)}
.systems-link:focus-visible{outline:2px solid var(--ink);outline-offset:4px}

/* Sub-Page 02: Studio Umbrella (50 Frames + Filter Bar) */
.studio-filter-bar{display:flex;flex-wrap:wrap;gap:10px;padding:4vh 4vw 2vh;border-bottom:1px solid var(--line)}
.studio-filter-pill{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .25s cubic-bezier(.16,1,.3,1),color .25s cubic-bezier(.16,1,.3,1),border-color .25s}
.studio-filter-pill:hover{border-color:var(--ink)}
.studio-filter-pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.studio-filter-pill:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.studio-gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vw;padding:4vh 4vw 10vh;align-items:start}
.studio-frame{border:1px solid var(--line);border-radius:0;background:#121214;overflow:hidden;position:relative;transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1),border-color .3s ease}
.studio-frame.ratio-portrait{aspect-ratio:4/5}
.studio-frame.ratio-square{aspect-ratio:1/1}
.studio-frame.is-filtered-out{display:none}
.studio-frame.is-animating{opacity:0;transform:scale(.96)}
.studio-frame:hover{border-color:var(--ink)}
.studio-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.studio-frame:hover img{transform:scale(1.05)}

/* Sub-Page 03: Editorial (5 Decks + 3 Inline Blogs) */
.editorial-decks-section{padding:6vh 4vw 8vh}
.editorial-sec-label{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;margin-bottom:3vh}
.editorial-decks-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2vw}
.editorial-deck-card{border:1px solid var(--line);border-radius:0;background:#0e0e10;overflow:hidden;transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .3s ease}
.editorial-deck-card:hover{transform:perspective(900px) rotateX(2deg) translateY(-4px);border-color:var(--ink)}
.editorial-deck-media{aspect-ratio:16/9;position:relative;overflow:hidden;background:#141417;border-bottom:1px solid var(--line)}
.editorial-deck-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.editorial-deck-card:hover .editorial-deck-media img{transform:scale(1.06)}
.editorial-slide-badge{position:absolute;top:14px;right:14px;padding:5px 10px;background:rgba(10,10,11,.86);border:1px solid var(--line);color:var(--ink);font:400 10px 'IBM Plex Mono',monospace;letter-spacing:.08em}
.editorial-deck-meta{padding:20px}
.editorial-deck-title{font:500 20px 'Inter Tight',system-ui,sans-serif;letter-spacing:-.02em;color:var(--ink);margin:0 0 8px}
.editorial-deck-desc{font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:var(--mid);margin:0}

.editorial-blogs-section{padding:4vh 4vw 12vh;border-top:1px solid var(--line)}
.editorial-blog-list{border-top:1px solid var(--line)}
.editorial-blog-item{border-bottom:1px solid var(--line)}
.editorial-blog-trigger{width:100%;background:transparent;border:none;color:var(--ink);padding:4vh 0;display:grid;grid-template-columns:185px 1fr auto;align-items:center;gap:2vw;text-align:left;cursor:pointer;outline:none;transition:background .3s ease}
.editorial-blog-trigger:hover{background:rgba(244,241,234,.025)}
.editorial-blog-trigger:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.editorial-blog-meta{font:400 11px/1.6 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;white-space:nowrap}
.editorial-blog-headline{font:500 clamp(22px,2.5vw,36px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;line-height:1.15;color:var(--ink)}
.editorial-blog-toggle{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink);text-transform:uppercase;white-space:nowrap;padding:8px 14px;border:1px solid var(--line);transition:background .25s,color .25s}
.editorial-blog-trigger:hover .editorial-blog-toggle,.editorial-blog-item.is-open .editorial-blog-toggle{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.editorial-blog-drawer{max-height:0;overflow:hidden;transition:max-height .6s cubic-bezier(.16,1,.3,1)}
.editorial-blog-item.is-open .editorial-blog-drawer{max-height:1600px}
.editorial-article-body{padding:0 0 5vh calc(185px + 2vw);max-width:86ch;display:flex;flex-direction:column;gap:18px}
.editorial-article-body p{font:400 15px/1.75 'Inter Tight',system-ui,sans-serif;color:#d6d3cb;margin:0}
.editorial-article-callout{padding:18px 22px;border-left:2px solid var(--ink);background:rgba(244,241,234,.03);font:400 12.5px/1.6 'IBM Plex Mono',monospace;color:var(--ink)}

/* ==================== CREDENTIALS ROUTE (/credentials) ==================== */
.credentials-page{position:relative;width:100%;background:var(--bg);min-height:100vh;min-height:100svh}
.credentials-hero{padding:20vh 4vw 8vh 4vw;width:100%;position:relative}
.credentials-hero-title{font:500 clamp(36px,5.8vw,88px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.035em;line-height:1.06;color:var(--ink);margin:2.5vh 0 2vh;max-width:18ch;text-transform:uppercase}
.credentials-hero-subtitle{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase;display:block}

/* Sections 04.1–04.3: 37 Clean Image-Ready Certificate Frames */
.cert-section{padding:4vh 4vw 10vh 4vw;perspective:1400px}
.cert-section-header{margin-bottom:4vh}
.cert-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2vw;transform-style:preserve-3d}
.cert-card{opacity:0;transform:translateY(100px) rotateX(45deg) scale(0.9);transform-origin:center top;transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);will-change:transform,opacity;perspective:1000px;outline:none;cursor:default}
.cert-card:focus-visible{outline:2px solid var(--ink);outline-offset:6px;opacity:1;transform:translateY(0) rotateX(0deg) scale(1)}
.cert-card.is-revealed{opacity:1;transform:translateY(0) rotateX(0deg) scale(1)}
.cert-frame{width:100%;aspect-ratio:16/11;background:#121214;border:1px solid var(--line);border-radius:0;position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.16,1,.3,1),border-color .4s ease,box-shadow .4s ease;will-change:transform}
.cert-frame.is-portrait{aspect-ratio:3/4}
.cert-frame:hover,.cert-card:hover .cert-frame,.cert-card:focus-visible .cert-frame{border-color:var(--ink);box-shadow:0 16px 36px rgba(0,0,0,.45)}
.cert-plus-mark{position:absolute;inset:0;display:grid;place-items:center;font:400 18px 'IBM Plex Mono',monospace;color:var(--ink);opacity:0.12;pointer-events:none;user-select:none;transition:opacity .25s ease;z-index:1}
.cert-frame.has-image .cert-plus-mark{opacity:0}
.cert-frame img[data-cert-slot="true"]{position:relative;z-index:1}
.cert-spotlight{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s ease;background:radial-gradient(circle 240px at var(--mx,50%) var(--my,50%),rgba(244,241,234,0.14),transparent 60%)}
.cert-card:hover .cert-spotlight,.cert-card:focus-visible .cert-spotlight{opacity:1}
.cert-caption{padding-top:1.4vh}
.cert-name{font-family:"Inter Tight",system-ui,sans-serif;font-weight:500;font-size:15px;color:var(--ink);line-height:1.3}
.cert-id{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11px;color:var(--mid);letter-spacing:0.06em;margin-top:0.4vh;overflow-wrap:anywhere}
@media (max-width:1024px){
  .cert-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .cert-grid{grid-template-columns:1fr}
}


/* Section 03: Developer Badges (Aligned Nano-Grid + Spotlight + Category Filter) */
#badges-section{padding:12vh 4vw 18vh 4vw;background:var(--bg);position:relative}
.badges-header{margin-bottom:3vh;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.badges-filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:3vh}
.badge-filter-btn{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;cursor:pointer;transition:color .25s ease,border-color .25s ease,background .25s ease}
.badge-filter-btn:hover{color:var(--ink);border-color:rgba(244,241,234,.45)}
.badge-filter-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.badge-filter-btn.is-active{color:var(--bg);background:var(--ink);border-color:var(--ink);font-weight:500}
.badges-grid-container{display:grid;grid-template-columns:repeat(8,1fr);gap:1vw;position:relative;will-change:transform;transform-origin:center center;transition:transform .2s ease-out;padding:2vw;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle 350px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(244,241,234,0.1) 0%, transparent 60%)}
.badge-frame{aspect-ratio:1/1;border-radius:8px;background:#121214;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s ease,transform .3s cubic-bezier(.16,1,.3,1),background .3s ease;cursor:default;outline:none}
.badge-frame[hidden]{display:none!important}
.badge-frame:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.badge-frame:hover,.badge-frame:focus-visible{border-color:rgba(244,241,234,0.65);background:#17171b}
.badge-img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.badge-frame:hover .badge-img,.badge-frame:focus-visible .badge-img{transform:scale(1.12)}
.badge-issuer-pill{position:absolute;bottom:8px;left:50%;transform:translate(-50%,6px);opacity:0;pointer-events:none;background:rgba(10,10,11,.92);border:1px solid rgba(244,241,234,.28);color:var(--ink);font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;transition:opacity .25s ease,transform .3s cubic-bezier(.16,1,.3,1);z-index:2}
.badge-frame:hover .badge-issuer-pill,.badge-frame:focus-visible .badge-issuer-pill{opacity:1;transform:translate(-50%,0)}
.badge-fallback{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;color:var(--mid)}
.badge-fallback svg{width:28px;height:28px;fill:currentColor;color:var(--ink)}
.badge-fallback span{font:400 8.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.badge-frame.is-fallback .badge-img{display:none}
.badge-frame.is-fallback .badge-fallback{display:flex}

/* Footer Sitemap Navigation */
.footer-sitemap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:10px 0}
.footer-link{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-decoration:none;transition:color .3s;border-radius:2px}
.footer-link:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.footer-link:hover,.footer-link.active{color:var(--ink)}

/* Home Page Extension: Architectural Aperture & Kinetic Typography (<section id="home-vision">) */
#home-vision{width:100%;min-height:110vh;min-height:110svh;background:var(--bg);color:var(--ink);padding:14vh 4vw;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;z-index:10}
.vision-telemetry-header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-bottom:3vh;border-bottom:1px solid var(--line);font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
#vision-telemetry{color:var(--ink);font-variant-numeric:tabular-nums}
.vision-stage{display:flex;flex-direction:column;gap:2.5vh;margin:8vh 0}
.vision-line-top,.vision-line-bot{font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;font-size:clamp(44px,8.2vw,136px);line-height:.95;letter-spacing:-.05em;color:var(--ink);will-change:transform;margin:0}
.vision-line-top{text-align:left}
.vision-line-bot{text-align:right}
.vision-aperture{width:100%;height:24vh;min-height:180px;border:1px solid var(--line);border-radius:0;overflow:hidden;position:relative;background:#121214;clip-path:inset(0 32% 0 32%);will-change:clip-path}
.vision-aperture-pan{width:115%;height:100%;will-change:transform}
.vision-aperture-img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(100%) contrast(1.15);transform:scale(1);transition:filter .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);will-change:transform,filter}
.vision-aperture:hover .vision-aperture-img{filter:grayscale(0%) contrast(1.15);transform:scale(1.04)}
.vision-crosshair-grid{position:absolute;inset:0;pointer-events:none;z-index:2;background-image:linear-gradient(to right,rgba(244,241,234,0.06) 1px,transparent 1px),linear-gradient(to bottom,rgba(244,241,234,0.06) 1px,transparent 1px);background-size:48px 48px}
.vision-pillars{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.vision-pillar{padding:3.5vh 2vw;border-right:1px solid var(--line)}
.vision-pillar:last-child{border-right:none}
.vision-pillar-title{font:400 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ink);margin:0}
.vision-pillar-desc{font:400 14px/1.45 'Inter Tight',system-ui,sans-serif;color:var(--mid);margin:1.2vh 0 0}

/* Home Page Extension: Interactive Manifesto Accordion (<section id="home-manifesto">) */
#home-manifesto{padding:15vh 4vw;border-top:1px solid var(--line);background:var(--bg);color:var(--ink);position:relative;z-index:10}
.home-manifesto-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4vh}
.manifesto-accordion-list{border-top:1px solid var(--line)}
.manifesto-row{display:flex;justify-content:space-between;align-items:flex-start;gap:4vw;border-bottom:1px solid var(--line);padding:4vh 0;cursor:pointer;outline:none;transition:border-color .4s ease}
.manifesto-row:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.manifesto-row:hover,.manifesto-row.is-expanded{border-bottom-color:rgba(244,241,234,0.45)}
.manifesto-row-main{flex:1;min-width:0}
.manifesto-row-title-wrap{display:flex;align-items:baseline;gap:1.5vw;flex-wrap:wrap;transition:transform .6s cubic-bezier(.16,1,.3,1);will-change:transform}
.manifesto-row:hover .manifesto-row-title-wrap,.manifesto-row:focus-visible .manifesto-row-title-wrap,.manifesto-row.is-expanded .manifesto-row-title-wrap{transform:translateX(2vw)}
.manifesto-row-title{font:500 clamp(34px,5.2vw,78px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.035em;line-height:1.05;color:var(--ink)}
.manifesto-row-sub{font:400 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.manifesto-row-desc{font:400 14px/1.6 'IBM Plex Mono',monospace;color:#b4b1a8;max-width:68ch;max-height:0;opacity:0;overflow:hidden;margin:0;transition:max-height .6s cubic-bezier(.16,1,.3,1),opacity .6s cubic-bezier(.16,1,.3,1),margin-top .6s cubic-bezier(.16,1,.3,1)}
.manifesto-row:hover .manifesto-row-desc,.manifesto-row:focus-visible .manifesto-row-desc,.manifesto-row.is-expanded .manifesto-row-desc{max-height:100px;opacity:1;margin-top:16px}
.manifesto-row-index{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);padding-top:1.4vh;flex-shrink:0}

/* About Page Extension: Sticky Stacking Deck (<section id="about-process">) */
#about-process{width:100vw;margin-left:calc(-50vw + 50%);height:600vh;position:relative;background:var(--bg);border-top:1px solid var(--line)}
.canvas-stage{position:sticky;top:0;height:100vh;height:100svh;width:100vw;overflow:hidden;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4vw;gap:2vw}
.canvas-left-label{justify-self:start;text-align:left;z-index:15}
.canvas-right-label{justify-self:end;text-align:right;z-index:15}
.canvas-eyebrow{font:400 10px/1.4 'IBM Plex Mono',monospace;color:var(--mid);letter-spacing:.08em;margin-bottom:1vh;text-transform:uppercase;display:block}
.canvas-split-title{font:500 clamp(28px,3.6vw,64px)/.95 'Inter Tight',system-ui,sans-serif;letter-spacing:-.04em;color:var(--ink);margin:0;white-space:nowrap}
.canvas-deck-slot{position:relative;width:min(35vw,calc(78vh * 0.75));aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.canvas-card{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;border:1px solid var(--line);background:#121214;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.5);will-change:transform,filter;transform-origin:center center;outline:none}
.canvas-card:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.canvas-card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8;display:block;transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);will-change:transform,opacity}
.canvas-card:hover .canvas-card-img,.canvas-card:focus-visible .canvas-card-img{opacity:1;transform:scale(1.05)}
.canvas-card-vignette{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,11,.68) 0%,rgba(10,10,11,.08) 38%,rgba(10,10,11,.88) 100%);pointer-events:none;z-index:1}
.canvas-card-label{position:absolute;top:20px;left:20px;z-index:2;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink);text-transform:uppercase}
.canvas-card-footer{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
.canvas-card-subtitle{font:400 12px/1.45 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#e6e3dc;text-transform:uppercase}

/* About Page Extension: Creative Outlets — Poetry & Audio (<section id="about-artistry">) */
#about-artistry{width:100vw;margin-left:calc(-50vw + 50%);height:300vh;position:relative;background:var(--bg);border-top:1px solid var(--line)}
.artistry-sticky{position:sticky;top:0;height:100vh;height:100svh;width:100vw;overflow:hidden;display:flex;align-items:center}
.artistry-header{position:absolute;top:96px;left:4vw;z-index:15;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid);text-transform:uppercase}
.artistry-track{display:flex;align-items:center;gap:10vw;padding:0 25vw;width:max-content;will-change:transform}
.artistry-frame{width:50vw;min-width:320px;aspect-ratio:16/9;position:relative;flex-shrink:0;overflow:hidden;border:1px solid var(--line);background:#121214;filter:grayscale(80%);transform:scale(0.85);transform-origin:center center;will-change:transform,filter;outline:none}
.artistry-frame:focus-visible{outline:2px solid var(--ink);outline-offset:6px;filter:grayscale(0%)!important;transform:scale(1)!important}
.artistry-frame:focus-visible .artistry-overlay{opacity:1!important}
.artistry-frame img{width:100%;height:100%;object-fit:cover;display:block}
.artistry-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,11,.92) 0%,rgba(10,10,11,.48) 45%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,3vw,40px);opacity:0;will-change:opacity;pointer-events:none}
.artistry-tag{font:400 10.5px 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--mid);text-transform:uppercase;margin-bottom:8px}
.artistry-title{font:500 clamp(24px,3vw,46px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.03em;color:var(--ink);line-height:1.05;margin-bottom:8px}
.artistry-desc{font:400 12.5px/1.5 'IBM Plex Mono',monospace;color:#d5d2cb;max-width:56ch;margin:0}

/* Global Route Error & 404 Fallback */
.route-error-page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:120px 6vw;background:var(--bg);color:var(--ink);max-width:1100px;margin:0 auto}
.route-error-code{font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--mid);text-transform:uppercase;margin-bottom:18px}
.route-error-title{font:500 clamp(34px,5.5vw,76px) 'Inter Tight',system-ui,sans-serif;letter-spacing:-.04em;line-height:1.05;margin-bottom:18px}
.route-error-msg{font:400 13px/1.6 'IBM Plex Mono',monospace;color:#b4b1a8;max-width:58ch;margin-bottom:32px}
.route-error-btn{height:44px;padding:0 26px;border-radius:99px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.route-error-btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.route-error-btn:hover{background:transparent;color:var(--ink)}

/* Responsive adjustments */
@media (max-width:1024px){
  .badges-grid-container{grid-template-columns:repeat(4,1fr);gap:1.5vw}
  .partners-grid{grid-template-columns:repeat(3,1fr);gap:1.8vw}
  .pillars-grid{grid-template-columns:repeat(2,1fr)}
  .approach-pipeline{grid-template-columns:repeat(3,1fr)}
  .principles-grid{grid-template-columns:repeat(2,1fr)}
}

@media (max-width:768px){
  .top{left:18px;right:18px;top:18px}
  .nav-links{display:none}
  .acts .contact-btn{display:none}
  .hamburger-btn{display:flex}
  .bot{left:18px;right:18px;bottom:18px;grid-template-columns:1fr auto}.bot .mid{display:none}
  .bot p{max-width:17em;font-size:11px}
  
  #index{height:420vh}
  .sec-header-sticky{top:74px;left:18px;right:18px}
  .horizontal-track{gap:12vw;padding:0 8vw}
  .work-card{width:78vw;min-width:280px}
  .card-bottom-typography{bottom:-4vw;left:-1vw}
  .card-title-massive{font-size:clamp(30px,7.5vw,52px)}
  .card-reflection .reflection-text{bottom:-4vw;left:-1vw;font-size:clamp(30px,7.5vw,52px)}
  .card-desc{max-width:76vw;font-size:11.5px}
  
  .contact-telemetry{padding:96px 20px 20px}
  .contact-headline-wrap{padding:32px 20px}
  .contact-composer{padding:32px 20px}
  .contact-social-row{padding:22px 20px}
  .contact-location-block{padding:28px 20px}

  .gallery-grid{grid-template-columns:1fr;gap:6vh;padding:4vh 18px 12vh}
  .gallery-card.span-7,.gallery-card.span-5,.gallery-card.span-6-neg,.gallery-card.span-6-pos{grid-column:span 1;margin-top:0}
  
  .about-page{padding:14vh 20px 10vh}
  .about-split{grid-template-columns:1fr;gap:5vh}
  
  .timeline-container{padding:6vh 0}
  .timeline-rail,.timeline-progress-line{left:20px}
  .timeline-item.item-left,.timeline-item.item-right{width:calc(100% - 50px);margin-left:50px;text-align:left;transform:translateX(30px);margin-bottom:20vh}
  .timeline-item.item-left.in-view,.timeline-item.item-right.in-view{transform:translateX(0);opacity:1}
  .timeline-item.item-left .timeline-node,.timeline-item.item-right .timeline-node{left:-30px;right:auto;transform:translate(-50%,0) scale(0)}
  .timeline-item.item-left.in-view .timeline-node,.timeline-item.item-right.in-view .timeline-node{transform:translate(-50%,0) scale(1)}
  .skills-grid{grid-template-columns:repeat(2,1fr);gap:12px}

  /* Mobile adjustments for event-wall (3D Cylinder Carousel) */
  .cylinder-stage{padding:max(76px,9vh) 4vw 4vh}
  .cylinder-frame{width:76vw;margin-left:calc(76vw / -2);margin-top:calc((76vw * 0.625) / -2)}

  /* Mobile adjustments for community-partners */
  #community-partners{padding:8vh 20px 6vh}
  .partners-header{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:4vh}
  .partners-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .partner-card{aspect-ratio:1/2.35;opacity:1!important;transform:none!important}
  .partner-card.is-revealed{opacity:1!important;transform:none!important}
  .partner-top-section{padding:14px 12px 10px}
  .partner-vertical-text{gap:8px}
  .partner-name{font-size:14px}
  .partner-meta{font-size:9px;letter-spacing:.06em}
  .partner-year{font-size:9.5px}
  .partner-logo-img{filter:grayscale(0%)}

  #community-impact{padding:10vh 20px}
  .impact-grid{grid-template-columns:repeat(2,1fr);gap:36px 20px}
  .impact-card{border-left:none;padding-left:0}

  /* Mobile adjustments for credentials */
  .credentials-hero{padding:16vh 20px 6vh 20px}
  .cert-section,#badges-section{padding:4vh 20px 8vh 20px}
  .cert-grid{gap:20px}
  .badges-grid-container{grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}

  #manifesto{padding:14vh 18px}
  #home-vision{min-height:auto;padding:10vh 20px}
  .vision-telemetry-header{padding-bottom:2vh;font-size:10px}
  .vision-stage{margin:5vh 0;gap:2vh}
  .vision-aperture{height:22vh;min-height:160px}
  .vision-pillars{grid-template-columns:1fr}
  .vision-pillar{padding:2.5vh 0;border-right:none;border-bottom:1px solid var(--line)}
  .vision-pillar:last-child{border-bottom:none}
  #home-manifesto{padding:10vh 20px}
  .manifesto-row{padding:3vh 0;gap:12px}
  .manifesto-row:hover .manifesto-row-title-wrap,.manifesto-row.is-expanded .manifesto-row-title-wrap{transform:translateX(1.5vw)}
  .manifesto-row-desc{font-size:12.5px}
  .manifesto-row:hover .manifesto-row-desc,.manifesto-row:focus-visible .manifesto-row-desc,.manifesto-row.is-expanded .manifesto-row-desc{max-height:160px}

  .canvas-split-title{font-size:clamp(26px,7vw,42px)}

  #about-artistry{height:auto;padding:8vh 0 6vh}
  .artistry-sticky{position:relative;height:auto;display:block}
  .artistry-header{position:relative;top:auto;left:auto;padding:0 20px 24px}
  .artistry-track{display:flex;flex-direction:column;gap:24px;padding:0 20px;width:100%;transform:none!important}
  .artistry-frame{width:100%;min-width:0;transform:none!important;filter:grayscale(0%)!important}
  .artistry-overlay{opacity:1!important}

  .footer-top{padding:18px;flex-direction:column;gap:24px}
  .magnetic-btn{width:130px;height:130px;font-size:12px}
}

@media (min-width: 769px) and (max-width: 1100px) {
  .partners-grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .badges-grid-container{grid-template-columns:repeat(5,1fr);gap:14px}
}

@media (max-width: 900px) {
  .contact-workspace{grid-template-columns:1fr}
  .contact-channels{border-left:none;border-top:1px solid var(--line)}
  .about-split{grid-template-columns:1fr;gap:5vh}
  .matrix-grid{grid-template-columns:1fr}
  .matrix-col{border-right:none;border-bottom:1px solid var(--line);padding:3vh 0}
  .matrix-col:last-child{border-bottom:none}
  .canvas-stage{grid-template-columns:1fr;justify-items:center;align-content:center;gap:2.2vh;padding:76px 4vw 4vh}
  .canvas-left-label,.canvas-right-label{justify-self:center;text-align:center}
  .canvas-deck-slot{width:min(82vw,46vh)}
}

/* Disable Sticky Hover & Mousemove Physics on Touch Devices */
@media (hover: none) and (pointer: coarse) {
  .card-inner,.magnetic-btn,.magnetic-text,.work-cta-link,.contact-submit-btn{transform:none!important}
